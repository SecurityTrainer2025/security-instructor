name: Randomize assessment answer order
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Randomize answer choices without changing the question bank
        shell: python
        run: |
          from pathlib import Path

          p = Path('frontend/course-assessment-v2.html')
          s = p.read_text(encoding='utf-8')

          if 'const __shuffleAssessmentOptions' not in s:
              marker = 'render();'
              patch = r'''const __shuffleAssessmentOptions=function(){questions=questions.map(function(q){var pairs=[];for(var n=0;n<q[2].length;n+=2){pairs.push({en:q[2][n],ar:q[2][n+1],correct:(n/2)===q[3]});}for(var j=pairs.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=pairs[j];pairs[j]=pairs[k];pairs[k]=tmp;}var correct=pairs.findIndex(function(x){return x.correct;});var options=[];pairs.forEach(function(x){options.push(x.en,x.ar);});return [q[0],q[1],options,correct];});};__shuffleAssessmentOptions();'''
              if marker not in s:
                  raise SystemExit('Assessment render marker not found')
              s = s.replace(marker, patch + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/course-assessment-v2.html
          git rm .github/workflows/randomize-assessment-answers.yml
          git commit -m "Apply assessment answer randomization"
          git push
