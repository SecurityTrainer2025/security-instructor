name: Refresh Contact Graph script

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update contact admin cache version
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/admin.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('contact-admin.js?v=20260913-1534','contact-admin.js?v=20260913-graph-1')
          p.write_text(text,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/admin.html
          git diff --cached --quiet || git commit -m "Refresh contact Graph reply script"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/patch-admin-mail-cache.yml
          git commit -m "Remove temporary Graph cache workflow"
          git push
