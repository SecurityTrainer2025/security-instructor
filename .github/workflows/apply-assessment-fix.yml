name: Apply assessment activation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply assessment activation fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing assessment behavior
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('frontend/course-assessment-v2.html')
          s=p.read_text(encoding='utf-8')
          old="""function render(){selected=null;const q=questions[i];document.getElementById('count').textContent=`Question ${i+1} of ${questions.length} / السؤال ${i+1} من ${questions.length}`;document.getElementById('qnum').textContent=`QUESTION ${i+1}`;document.getElementById('qEn').textContent=q[0];document.getElementById('qAr').textContent=q[1];document.getElementById('bar').style.width=(i/questions.length*100)+'%';const o=document.getElementById('options');o.innerHTML='';for(let n=0;n<4;n+=2){const b=document.createElement('button');b.className='option';b.innerHTML=`<span>${q[2][n]}</span><span class=\"ar\">${q[2][n+1]}</span>`;b.onclick=()=>{selected=n/2;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('next').disabled=false};o.appendChild(b)}document.getElementById('next').textContent=i===questions.length-1?'Finish Assessment / إنهاء التقييم':'Next Question / السؤال التالي'}document.getElementById('next').onclick=()=>{if(selected===null)return;if(selected===q[3])score++;i++;if(i<questions.length)render();else finish()}}function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=score+'/10';document.getElementById('resultText').innerHTML=score>=8?'Strong initial knowledge. / مستوى معرفي مبدئي قوي.':score>=5?'Good initial foundation. / أساس معرفي مبدئي جيد.':'Further learning is recommended before training begins. / يوصى بمزيد من التعلم قبل بدء التدريب.';document.getElementById('retry').onclick=()=>location.reload()}render();"""
          new="""function render(){selected=null;const q=questions[i];document.getElementById('count').textContent=`Question ${i+1} of ${questions.length} / السؤال ${i+1} من ${questions.length}`;document.getElementById('qnum').textContent=`QUESTION ${i+1}`;document.getElementById('qEn').textContent=q[0];document.getElementById('qAr').textContent=q[1];document.getElementById('bar').style.width=(i/questions.length*100)+'%';const o=document.getElementById('options');o.innerHTML='';for(let n=0;n<8;n+=2){const b=document.createElement('button');b.className='option';b.innerHTML=`<span>${q[2][n]}</span><span class=\"ar\">${q[2][n+1]}</span>`;b.onclick=()=>{selected=n/2;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('next').disabled=false};o.appendChild(b)}document.getElementById('next').textContent=i===questions.length-1?'Finish Assessment / إنهاء التقييم':'Next Question / السؤال التالي';document.getElementById('next').onclick=()=>{if(selected===null)return;if(selected===q[3])score++;i++;if(i<questions.length)render();else finish()}}function finish(){document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';document.getElementById('score').textContent=score+'/10';document.getElementById('resultText').innerHTML=score>=8?'Strong initial knowledge. / مستوى معرفي مبدئي قوي.':score>=5?'Good initial foundation. / أساس معرفي مبدئي جيد.':'Further learning is recommended before training begins. / يوصى بمزيد من التعلم قبل بدء التدريب.';document.getElementById('retry').onclick=()=>location.reload()}render();"""
          if old in s:
              p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('frontend/config.js')
          s=p.read_text(encoding='utf-8')
          marker="setTimeout(function(){var adminCourseBtn=document.getElementById('adminCourseBtn');"
          if marker in s and 'assessment observer' not in s:
              inject="""\n/* assessment observer */\nvar assessmentObserver=new MutationObserver(function(){var grid=document.getElementById('courseGrid');if(!grid)return;grid.querySelectorAll('.course-card').forEach(function(card){var trigger=card.querySelector('[data-course]');if(!trigger||card.querySelector('[data-course-assessment]'))return;var slug=trigger.getAttribute('data-course');var a=document.createElement('a');a.setAttribute('data-course-assessment',slug);a.href='course-assessment-v2.html?course='+encodeURIComponent(slug);a.innerHTML='Initial Course Assessment / التقييم المبدئي للدورة';a.style.cssText='display:inline-block;margin:10px 8px 0 0;padding:11px 16px;border:1px solid #c8a96b;color:#c8a96b;background:transparent;text-decoration:none;font-weight:800;';trigger.insertAdjacentElement('beforebegin',a);});});\nassessmentObserver.observe(document.body,{childList:true,subtree:true});\nsetTimeout(function(){var grid=document.getElementById('courseGrid');if(grid){var ev=document.createEvent('Event');ev.initEvent('assessmentcardsready',true,true);grid.dispatchEvent(ev);}},0);\n"""
              s=s.replace(marker,inject+marker)
              p.write_text(s,encoding='utf-8')

          p=Path('frontend/course-details.html')
          s=p.read_text(encoding='utf-8')
          pattern=r'<div class="footer-actions">\s*<a class="action primary" href="\$\{\'course-assessment-v2\.html\?course=\'\+encodeURIComponent\(slug\)\}">([^<]*)</a>\s*<a class="action secondary" href="index\.html#courses">([^<]*)</a>\s*</div>'
          m=re.search(pattern,s)
          if m:
              replacement='<div class="assessment-top"><a class="action primary" href="course-assessment-v2.html?course=${encodeURIComponent(slug)}">▣ &nbsp; Initial Course Assessment / التقييم المبدئي للدورة</a></div><div class="footer-actions"><a class="action secondary" href="index.html#courses">'+m.group(2)+'</a></div>'
              s=re.sub(pattern,replacement,s,count=1)
              s=s.replace('.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}', '.assessment-top{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}')
              p.write_text(s,encoding='utf-8')
      - name: Commit patched files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/course-assessment-v2.html frontend/config.js frontend/course-details.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply assessment activation fix"
          git push
