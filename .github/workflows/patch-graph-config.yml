name: Add Microsoft Graph public config

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add public Microsoft Graph config endpoint
        shell: python
        run: |
          from pathlib import Path
          p=Path('backend/server.js')
          text=p.read_text(encoding='utf-8')
          marker="app.get('/health',(req,res)=>res.json({ok:true}));"
          insert="app.get('/api/public-config',(req,res)=>res.json({microsoftClientId:String(process.env.MICROSOFT_CLIENT_ID||'').trim()}));\n"
          if "app.get('/api/public-config'" not in text:
              if marker not in text:
                  raise SystemExit('health route marker not found')
              text=text.replace(marker,marker+'\n'+insert,1)
              p.write_text(text,encoding='utf-8')
      - name: Validate backend syntax
        run: node --check backend/server.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git diff --cached --quiet || git commit -m "Add Microsoft Graph public config endpoint"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/patch-graph-config.yml
          git commit -m "Remove temporary Graph config workflow"
          git push
