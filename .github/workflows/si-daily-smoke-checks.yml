name: SI Daily Smoke Checks

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: si-daily-smoke-checks
  cancel-in-progress: false

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate SI admin dashboard script and AVS staging-only guard
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("frontend/admin/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, flags=re.S)
          if not scripts:
              raise SystemExit("Expected at least one inline admin script")
          Path("/tmp/si-admin-inline.js").write_text("\n".join(scripts), encoding="utf-8")
          required = [
              'data-tab="workshops"',
              'id="avsInviteBtn"',
              "get('api')==='staging'",
              "if(!isStagingApi)",
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing dashboard safety features: " + ", ".join(missing))
          print("PASS | Workshop tab, Staging-only invitation mode, and safety guard are present.")
          PY
          node --check /tmp/si-admin-inline.js
      - name: Validate expert article submission and moderation flow
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          server = Path("backend/server.js").read_text(encoding="utf-8")
          form = Path("frontend/article-submit.html").read_text(encoding="utf-8")
          checks = {
              "single-language submission route": "submittedContent" in server and "Article content must be between 500 and 1000 words" in server,
              "pending-only article submission": "status:'pending'" in server,
              "admin completion required before approval": "Complete the following editorial fields before approval" in server,
              "translation readiness returned to admin": "translationStatus:a.titleEn&&a.titleAr" in server,
              "author photo is optional": not re.search(r'id="authorPhoto"[^>]*\\brequired\\b', form),
              "category is optional": not re.search(r'id="category"[^>]*\\brequired\\b', form),
              "no forced second-language fields in submission payload": "titleEn:sourceLang.value==='en'?sourceTitle.value:''" in form and "titleAr:sourceLang.value==='ar'?sourceTitle.value:''" in form,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + " | " + name)
          if failed:
              raise SystemExit("Article workflow checks failed: " + ", ".join(failed))
          scripts = re.findall(r"<script>(.*?)</script>", form, flags=re.S)
          if not scripts:
              raise SystemExit("No inline article submission script found")
          Path("/tmp/si-article-submit.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check backend/server.js
          node --check /tmp/si-article-submit.js
      - name: Check public frontend
        id: frontend
        shell: bash
        run: |
          set +e
          for url in \
            "https://securitytrainer2025.github.io/security-instructor/frontend/index.html" \
            "https://securitytrainer2025.github.io/security-instructor/frontend/fire-safety-self-study-register.html" \
            "https://securitytrainer2025.github.io/security-instructor/frontend/fire-safety-self-study.html"; do
            code=$(curl --location --silent --show-error --output /tmp/si-page.html --write-out "%{http_code}" --max-time 25 "$url" 2>/tmp/si-curl.err)
            rc=$?
            if [ "$rc" -eq 0 ] && [ "$code" = "200" ]; then
              echo "PASS | HTTP $code | $url" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL | HTTP ${code:-no response}, curl exit $rc | $url" | tee -a "$GITHUB_STEP_SUMMARY"
              cat /tmp/si-curl.err >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "failed=true" >> "$GITHUB_OUTPUT"
            fi
          done
          exit 0

      - name: Check self-study API
        id: api
        shell: bash
        run: |
          set +e
          url="https://security-instructor.onrender.com/api/self-study/courses/fire-safety-emergency-response"
          code=""
          rc=1
          for attempt in 1 2 3; do
            code=$(curl --location --silent --show-error --output /tmp/si-api.json --write-out "%{http_code}" --max-time 35 "$url" 2>/tmp/si-api.err)
            rc=$?
            if [ "$rc" -eq 0 ] && [ "$code" = "200" ]; then break; fi
            sleep 8
          done
          if [ "$rc" -eq 0 ] && [ "$code" = "200" ] && grep -q '"screenCount"' /tmp/si-api.json; then
            echo "PASS | API returned HTTP 200 and course metadata" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL | Self-study API did not return expected course metadata (HTTP ${code:-no response})" | tee -a "$GITHUB_STEP_SUMMARY"
            cat /tmp/si-api.err >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Final result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.frontend.outputs.failed }}" = "true" ] || [ "${{ steps.api.outputs.failed }}" = "true" ]; then
            echo "## Result: FAIL — investigate the failed checks above" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "## Result: PASS — public pages and self-study course API responded as expected" >> "$GITHUB_STEP_SUMMARY"
          fi
