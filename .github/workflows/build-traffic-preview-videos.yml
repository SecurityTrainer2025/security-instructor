name: Build Traffic training video previews
on:
  push:
    branches:
      - feat/self-study-traffic-course
    paths:
      - scripts/build_traffic_training_videos.py
      - .github/workflows/build-traffic-preview-videos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free open-source tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install --disable-pip-version-check pillow
      - name: Render bilingual MP4 videos
        run: python scripts/build_traffic_training_videos.py
      - name: Verify all videos can be decoded
        run: |
          test "$(find frontend/assets/traffic-videos -maxdepth 1 -name '*.mp4' | wc -l)" -eq 6
          for f in frontend/assets/traffic-videos/*.mp4; do
            ffprobe -v error -show_entries format=duration -of default=nw=1 "$f"
            ffmpeg -v error -i "$f" -f null - </dev/null
          done
      - name: Commit generated videos to pilot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/assets/traffic-videos/*.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Publish six generated Traffic training MP4 previews [skip ci]"
            git push origin HEAD:feat/self-study-traffic-course
          fi
