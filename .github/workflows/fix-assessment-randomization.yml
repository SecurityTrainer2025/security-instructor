name: Fix assessment answer randomization
on:
  push:
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch assessment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/course-assessment-v2.html')
          s=p.read_text(encoding='utf-8')
          marker='const __shuffleAssessmentOptions=function(){'
          if marker not in s:
              needle='render();'
              patch="""const __shuffleAssessmentOptions=function(){\nquestions=questions.map(function(q){\nvar pairs=[];\nfor(var n=0;n<q[2].length;n+=2){pairs.push({en:q[2][n],ar:q[2][n+1],correct:(n/2)===q[3]});}\nfor(var j=pairs.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=pairs[j];pairs[j]=pairs[k];pairs[k]=tmp;}\nvar correct=pairs.findIndex(function(x){return x.correct;});\nvar options=[];pairs.forEach(function(x){options.push(x.en,x.ar);});\nreturn [q[0],q[1],options,correct];\n});\n};\n__shuffleAssessmentOptions();\nrender();"""
              if needle not in s:
                  raise SystemExit('render marker not found')
              s=s.replace(needle,patch,1)
              p.write_text(s,encoding='utf-8')
          else:
              print('randomizer already present')
          PY
          grep -q "__shuffleAssessmentOptions" frontend/course-assessment-v2.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/course-assessment-v2.html
          git diff --cached --quiet || git commit -m "Fix randomized assessment answers"
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-assessment-randomization.yml || true
          git commit -m "Remove temporary assessment randomization workflow" || true
          git push || true
