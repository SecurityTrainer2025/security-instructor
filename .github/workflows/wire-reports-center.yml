name: Wire Reports Center

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject Reports Center loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/admin.html')
          text = p.read_text(encoding='utf-8')
          loader = '<script src="reports-center.js?v=20260915"></script>'
          if loader not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('admin.html closing body tag not found')
              text = text.replace(marker, loader + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('Reports Center loader already present')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/wire-reports-center.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/admin.html .github/workflows/wire-reports-center.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Wire Reports Center into Admin page'
            git push origin HEAD:main
          fi
