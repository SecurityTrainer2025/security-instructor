name: Fix branded reply backend syntax

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace branded reply block safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('backend/server.js')
          text = p.read_text(encoding='utf-8')

          helpers = r'''function escapeHtmlEmail(v){
  return String(v??'').replace(/[&<>"']/g,function(m){
    const map={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
    return map[m];
  });
}
function toHtmlText(v){return escapeHtmlEmail(v).replace(/\r?\n/g,'<br>')}
function buildContactReplyHtml(name,originalMessage,replyText){
  const html=[
    '<!doctype html><html><body style="margin:0;background:#eef2f5;font-family:Arial,Helvetica,sans-serif;color:#1b2b3a">',
    '<div style="max-width:680px;margin:32px auto;background:#ffffff;border:1px solid #d9e0e6">',
    '<div style="background:#0B1F33;padding:26px 30px">',
    '<div style="font-size:13px;letter-spacing:2px;color:#c8a96b;font-weight:700">SECURITY INSTRUCTOR</div>',
    '<div style="font-size:24px;color:#ffffff;font-weight:700;margin-top:8px">Professional Training • Practical Skills • Safer Workplaces</div>',
    '</div><div style="padding:30px">',
    '<p style="font-size:16px;margin:0 0 16px">Dear '+escapeHtmlEmail(name)+',</p>',
    '<p style="font-size:15px;line-height:1.8;margin:0 0 22px">Thank you for contacting <strong>SECURITY INSTRUCTOR</strong>.</p>',
    '<div style="border-left:4px solid #c8a96b;background:#f6f8fa;padding:16px 18px;margin:0 0 22px">',
    '<div style="font-size:12px;color:#6f7d88;font-weight:700;text-transform:uppercase">Your Message</div>',
    '<div style="font-size:14px;line-height:1.8;margin-top:8px">'+toHtmlText(originalMessage)+'</div>',
    '</div>',
    '<div style="border-top:1px solid #e1e6ea;padding-top:20px">',
    '<div style="font-size:12px;color:#6f7d88;font-weight:700;text-transform:uppercase">Response</div>',
    '<div style="font-size:15px;line-height:1.9;margin-top:8px">'+toHtmlText(replyText)+'</div>',
    '</div>',
    '<div style="margin-top:30px;padding-top:18px;border-top:1px solid #e1e6ea">',
    '<div style="font-weight:700">Abdallah Abdelaziz Shalaby</div>',
    '<div style="color:#6f7d88;margin-top:4px">Training Support Executive | Fire Safety Trainer | LMS Specialist</div>',
    '<div style="color:#6f7d88;margin-top:8px">SECURITY INSTRUCTOR</div>',
    '</div></div>',
    '<div style="background:#0B1F33;color:#cbd5df;padding:14px 30px;font-size:12px;text-align:center">Professional Training • Practical Skills • Safer Workplaces</div>',
    '</div></body></html>'
  ];
  return html.join('');
}
function getMailTransport(){
  const user=(process.env.MAIL_FROM||process.env.ADMIN_EMAIL||'').trim();
  const clientId=(process.env.MS_CLIENT_ID||'').trim();
  const clientSecret=(process.env.MS_CLIENT_SECRET||'').trim();
  const refreshToken=(process.env.MS_REFRESH_TOKEN||'').trim();
  if(!user||!clientId||!clientSecret||!refreshToken)return null;
  return nodemailer.createTransport({host:'smtp-mail.outlook.com',port:587,secure:false,auth:{type:'OAuth2',user,clientId,clientSecret,refreshToken}});
}
'''

          helpers_pattern = re.compile(r"function escapeHtmlEmail\(v\)\{.*?function getMailTransport\(\)\{.*?\n\}\n\n+app\.get\('/health'", re.S)
          replacement = helpers + "\napp.get('/health'"
          text, count = helpers_pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate existing branded helper block')

          route = r'''app.post('/api/admin/contact-messages/:id/reply',requireAdmin,async(req,res)=>{
  try{
    const row=await ContactMessage.findById(req.params.id);
    if(!row)return res.status(404).json({message:'Contact message not found'});
    const replyText=clean(req.body?.reply,5000);
    if(replyText.length<2)return res.status(400).json({message:'Reply text is required'});
    const transport=getMailTransport();
    if(!transport)return res.status(503).json({message:'Email sending is not configured. Please add MS_CLIENT_ID, MS_CLIENT_SECRET, MS_REFRESH_TOKEN and MAIL_FROM to the server environment.'});
    const from=(process.env.MAIL_FROM||process.env.ADMIN_EMAIL||'').trim();
    const subject='Re: SECURITY INSTRUCTOR contact message';
    const html=buildContactReplyHtml(row.name,row.message,replyText);
    const textBody=[
      'Dear '+row.name+',',
      '',
      'Thank you for contacting SECURITY INSTRUCTOR.',
      '',
      'Your Message:',
      row.message,
      '',
      'Response:',
      replyText,
      '',
      'Best regards,',
      'Abdallah Abdelaziz Shalaby',
      'SECURITY INSTRUCTOR'
    ].join('\n');
    await transport.sendMail({from,replyTo:from,to:row.email,subject,html,text:textBody});
    row.status='replied';
    row.repliedAt=new Date();
    await row.save();
    res.json({ok:true,status:row.status,repliedAt:row.repliedAt});
  }catch(e){
    console.error('CONTACT_REPLY_ERROR',e);
    res.status(500).json({message:'Unable to send reply'});
  }
});
app.patch('/api/admin/contact-messages/:id/status' '''

          route_pattern = re.compile(r"app\.post\('/api/admin/contact-messages/:id/reply'.*?app\.patch\('/api/admin/contact-messages/:id/status'", re.S)
          text, count = route_pattern.subn(route, text, count=1)
          if count != 1:
              raise SystemExit('Could not locate existing reply route block')

          p.write_text(text, encoding='utf-8')

      - name: Validate backend syntax
        shell: bash
        run: node --check backend/server.js

      - name: Install nodemailer dependency if needed
        shell: bash
        run: |
          node -e "const p=require('./backend/package.json'); if(!p.dependencies.nodemailer) process.exit(1)" || true

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git diff --cached --quiet || git commit -m "Fix branded reply backend syntax"
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-branded-reply-syntax.yml
          git commit -m "Remove temporary branded reply syntax workflow"
          git push
