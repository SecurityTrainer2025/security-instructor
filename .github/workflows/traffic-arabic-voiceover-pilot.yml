name: Traffic intro Arabic narration pilot

on:
  push:
    branches:
      - pilot/traffic-arabic-voiceover
    paths:
      - .github/workflows/traffic-arabic-voiceover-pilot.yml
      - scripts/build_traffic_lesson_voiceovers.py
      - review/traffic-voiceover-review.html
      - review/traffic-interactive-pilot.html
      - review/traffic-module-01-enhanced.html
      - scripts/build_traffic_module_01_extended.py
      - scripts/build_traffic_module_02_extended.py
      - review/traffic-module-02-enhanced.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-narration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'edge-tts>=6.1,<8' pillow
      - name: Verify original video exists
        run: test -s frontend/assets/traffic-videos/00_course_introduction.mp4
      - name: Generate and validate narrated video
        run: python scripts/build_traffic_intro_voiceover.py
      - name: Generate six lesson narrations
        run: python scripts/build_traffic_lesson_voiceovers.py
      - name: Build extended four-minute foundations module
        run: python scripts/build_traffic_module_01_extended.py
      - name: Build extended four-minute gate access module
        run: python scripts/build_traffic_module_02_extended.py
      - name: Confirm audio track and duration
        run: |
          test -s frontend/assets/traffic-videos/00_course_introduction_narrated.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 frontend/assets/traffic-videos/00_course_introduction_narrated.mp4 | grep -qx aac
      - name: Prepare offline mobile review bundle
        run: |
          mkdir -p /tmp/si-traffic-review
          cp review/traffic-voiceover-review.html /tmp/si-traffic-review/index.html
          cp review/traffic-interactive-pilot.html /tmp/si-traffic-review/interactive.html
          cp review/traffic-module-01-enhanced.html /tmp/si-traffic-review/module-01.html
          cp review/traffic-module-02-enhanced.html /tmp/si-traffic-review/module-02.html
          cp frontend/assets/traffic-videos/02_gate_access_extended_en.vtt /tmp/si-traffic-review/
          cp frontend/assets/traffic-videos/01_foundations_extended_en.vtt /tmp/si-traffic-review/
          cp frontend/assets/traffic-videos/*_narrated.mp4 /tmp/si-traffic-review/
          test -s /tmp/si-traffic-review/01_foundations_extended_narrated.mp4
          test -s /tmp/si-traffic-review/module-01.html
          test -s /tmp/si-traffic-review/module-02.html
          test -s /tmp/si-traffic-review/02_gate_access_extended_narrated.mp4
          test "$(find /tmp/si-traffic-review -name '*_narrated.mp4' | wc -l)" -eq 9
      - name: Upload review-only video
        uses: actions/upload-artifact@v4
        with:
          name: traffic-intro-arabic-narration-review
          path: /tmp/si-traffic-review/
          if-no-files-found: error
          retention-days: 7
