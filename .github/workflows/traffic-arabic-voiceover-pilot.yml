name: Traffic intro Arabic narration pilot

on:
  push:
    branches:
      - pilot/traffic-arabic-voiceover
    paths:
      - .github/workflows/traffic-arabic-voiceover-pilot.yml
      - scripts/build_traffic_lesson_voiceovers.py
      - review/traffic-voiceover-review.html
      - review/traffic-interactive-pilot.html
      - review/traffic-module-01-enhanced.html
      - scripts/build_traffic_module_01_extended.py
      - scripts/build_traffic_module_02_extended.py
      - review/traffic-module-02-enhanced.html
      - scripts/validate_traffic_review_bundle.py
      - scripts/validate_traffic_media_tracks.py
      - scripts/traffic-media-browser.spec.cjs
      - scripts/test_traffic_pilot_flow.cjs
      - scripts/validate_traffic_ai_video_assets.py
      - scripts/build_traffic_ai_signal_narration.py
      - review/traffic-ai-audio-review.html
      - scripts/validate_traffic_ai_audio_review.py
      - review/traffic-ai-video-production-brief.md
      - 'review/traffic-ai-captions/**'
      - scripts/build_traffic_module_03_extended.py
      - review/traffic-module-03-enhanced.html
      - scripts/build_traffic_module_04_extended.py
      - review/traffic-module-04-enhanced.html
      - scripts/build_traffic_module_05_extended.py
      - review/traffic-module-05-enhanced.html
      - review/traffic-module-05-hand-signals-demo.html
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-narration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'edge-tts>=6.1,<8' pillow
      - name: Verify original video exists
        run: test -s frontend/assets/traffic-videos/00_course_introduction.mp4
      - name: Generate and validate narrated video
        run: python scripts/build_traffic_intro_voiceover.py
      - name: Generate six lesson narrations
        run: python scripts/build_traffic_lesson_voiceovers.py
      - name: Generate six Arabic AI hand-signal narration drafts
        run: python scripts/build_traffic_ai_signal_narration.py
      - name: Build extended four-minute foundations module
        run: python scripts/build_traffic_module_01_extended.py
      - name: Build extended four-minute gate access module
        run: python scripts/build_traffic_module_02_extended.py
      - name: Build pedestrian safety four-minute narrated module
        run: python scripts/build_traffic_module_03_extended.py
      - name: Build parking and emergency access four-minute narrated module
        run: python scripts/build_traffic_module_04_extended.py
      - name: Build hand signals foundation narrated module
        run: python scripts/build_traffic_module_05_extended.py
      - name: Confirm audio track and duration
        run: |
          test -s frontend/assets/traffic-videos/00_course_introduction_narrated.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 frontend/assets/traffic-videos/00_course_introduction_narrated.mp4 | grep -qx aac
      - name: Prepare offline mobile review bundle
        run: |
          mkdir -p /tmp/si-traffic-review
          cp review/traffic-voiceover-review.html /tmp/si-traffic-review/index.html
          cp review/traffic-interactive-pilot.html /tmp/si-traffic-review/interactive.html
          cp review/traffic-module-01-enhanced.html /tmp/si-traffic-review/module-01.html
          cp review/traffic-module-02-enhanced.html /tmp/si-traffic-review/module-02.html
          cp review/traffic-module-03-enhanced.html /tmp/si-traffic-review/module-03.html
          cp review/traffic-module-04-enhanced.html /tmp/si-traffic-review/module-04.html
          cp review/traffic-module-05-enhanced.html /tmp/si-traffic-review/module-05.html
          cp review/traffic-module-05-hand-signals-demo.html /tmp/si-traffic-review/traffic-module-05-hand-signals-demo.html
          mkdir -p /tmp/si-traffic-review/ai-video-captions
          mkdir -p /tmp/si-traffic-review/ai-audio
          cp review/traffic-ai-audio/*.ar.mp3 /tmp/si-traffic-review/ai-audio/
          cp review/traffic-ai-captions/*.en.vtt /tmp/si-traffic-review/ai-video-captions/
          cp review/traffic-ai-video-production-brief.md /tmp/si-traffic-review/ai-video-production-brief.md
          cp review/traffic-ai-audio-review.html /tmp/si-traffic-review/ai-audio-review.html
          cp frontend/assets/traffic-videos/05_hand_signals_extended_en.vtt /tmp/si-traffic-review/
          cp frontend/assets/traffic-videos/04_parking_emergency_extended_en.vtt /tmp/si-traffic-review/
          cp frontend/assets/traffic-videos/03_pedestrian_safety_extended_en.vtt /tmp/si-traffic-review/
          cp frontend/assets/traffic-videos/02_gate_access_extended_en.vtt /tmp/si-traffic-review/
          cp frontend/assets/traffic-videos/01_foundations_extended_en.vtt /tmp/si-traffic-review/
          cp frontend/assets/traffic-videos/*_narrated.mp4 /tmp/si-traffic-review/
          test -s /tmp/si-traffic-review/01_foundations_extended_narrated.mp4
          test -s /tmp/si-traffic-review/module-01.html
          test -s /tmp/si-traffic-review/module-02.html
          test -s /tmp/si-traffic-review/module-03.html
          test -s /tmp/si-traffic-review/module-04.html
          test -s /tmp/si-traffic-review/module-05.html
          test -s /tmp/si-traffic-review/traffic-module-05-hand-signals-demo.html
          test "$(find /tmp/si-traffic-review/ai-video-captions -name '*.en.vtt' | wc -l)" -eq 6
          test "$(find /tmp/si-traffic-review/ai-audio -name '*.ar.mp3' | wc -l)" -eq 6
          test -s /tmp/si-traffic-review/ai-video-production-brief.md
          test -s /tmp/si-traffic-review/ai-audio-review.html
          test -s /tmp/si-traffic-review/05_hand_signals_extended_narrated.mp4
          test -s /tmp/si-traffic-review/04_parking_emergency_extended_narrated.mp4
          test -s /tmp/si-traffic-review/03_pedestrian_safety_extended_narrated.mp4
          test -s /tmp/si-traffic-review/02_gate_access_extended_narrated.mp4
          test "$(find /tmp/si-traffic-review -name '*_narrated.mp4' | wc -l)" -eq 12
      - name: Validate bilingual interactive modules and review assets
        run: python scripts/validate_traffic_review_bundle.py
      - name: Test trainee flow and 80 percent quiz gates (Node, isolated)
        run: node scripts/test_traffic_pilot_flow.cjs
      - name: Validate actual video/audio tracks and subtitle time bounds
        run: python scripts/validate_traffic_media_tracks.py
      - name: Validate AI production brief and six English subtitle drafts
        run: python scripts/validate_traffic_ai_video_assets.py
      - name: Validate Arabic audio player and six narration scripts
        run: python scripts/validate_traffic_ai_audio_review.py
      - name: Install browser media QA dependencies
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser-check videos and English captions in review bundle
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/si-traffic-review >/tmp/traffic-review-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/index.html', timeout=2)
                  break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Review-only localhost media server failed')
          PY
          npx playwright test scripts/traffic-media-browser.spec.cjs --reporter=line --workers=2
      - name: Upload browser media QA evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-media-browser-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload review-only video
        uses: actions/upload-artifact@v4
        with:
          name: traffic-intro-arabic-narration-review
          path: /tmp/si-traffic-review/
          if-no-files-found: error
          retention-days: 7
