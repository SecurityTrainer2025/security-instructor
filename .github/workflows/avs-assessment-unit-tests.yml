name: AVS Workshop Assessment Unit Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assessment-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test isolated AVS assessment rules
        run: node --test backend/avs-emrg-2026-assessment.test.js backend/avs-emrg-2026-initial-assessment.test.js
