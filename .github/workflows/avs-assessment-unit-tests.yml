name: AVS Workshop Assessment Unit Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assessment-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check AVS API and persistence modules
        run: node --check backend/avs-emrg-2026-final-start-lock.js && node --check backend/avs-emrg-2026-release-gate.js && node --check backend/avs-emrg-2026-routes.js && node --check backend/avs-emrg-2026-persistence.js && node --check backend/avs-emrg-2026-lessons.js && node --check backend/avs-emrg-2026-certificates.js && node --check backend/avs-emrg-2026-certificate-policy.js && node --check backend/avs-staging-frontend-routes.js && node --check backend/avs-workshop-access-url.js && node --check backend/avs-emrg-2026-routes.js && node --check backend/server.js
      - name: Test isolated AVS assessment, workflow and certificate policies
        run: node --test backend/avs-emrg-2026-final-start-lock.test.js backend/avs-emrg-2026-assessment.test.js backend/avs-emrg-2026-initial-assessment.test.js backend/avs-emrg-2026-final-question-bank.test.js backend/avs-emrg-2026-formative-feedback.test.js backend/avs-emrg-2026-formative-question-bank.test.js backend/avs-emrg-2026-workflow-policy.test.js backend/avs-emrg-2026-lessons.test.js backend/avs-emrg-2026-certificates.test.js backend/avs-emrg-2026-release-gate.test.js backend/avs-staging-frontend-routes.test.js backend/avs-workshop-access-url.test.js
