name: Patch randomized answer order
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch assessment and challenge
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Assessment: preserve every question and option text, but randomize option pairs and carry the correct index.
          p=Path('frontend/course-assessment-v2.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"let questions=\[\.\.\.Q\[key\]\]\.sort\(\(\)=>Math\.random\(\)-\.5\);.*?function finish\(\)"
          replacement="""let questions=[...Q[key]].sort(()=>Math.random()-.5);function shuffleAssessmentOptions(){questions=questions.map(function(q){var pairs=[];for(var n=0;n<q[2].length;n+=2){pairs.push({en:q[2][n],ar:q[2][n+1],correct:(n/2)===q[3]});}for(var j=pairs.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=pairs[j];pairs[j]=pairs[k];pairs[k]=tmp;}var correct=pairs.findIndex(function(x){return x.correct;});var options=[];pairs.forEach(function(x){options.push(x.en,x.ar);});return [q[0],q[1],options,correct];});}shuffleAssessmentOptions();let i=0,score=0,selected=null;function render(){selected=null;const q=questions[i];document.getElementById('count').textContent=`Question ${i+1} of ${questions.length} / السؤال ${i+1} من ${questions.length}`;document.getElementById('qnum').textContent=`QUESTION ${i+1}`;document.getElementById('qEn').textContent=q[0];document.getElementById('qAr').textContent=q[1];document.getElementById('bar').style.width=(i/questions.length*100)+'%';const o=document.getElementById('options');o.innerHTML='';for(let n=0;n<8;n+=2){const b=document.createElement('button');b.className='option';b.innerHTML=`<span>${q[2][n]}</span><span class="ar">${q[2][n+1]}</span>`;b.onclick=()=>{selected=n/2;document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('next').disabled=false};o.appendChild(b)}document.getElementById('next').textContent=i===questions.length-1?'Finish Assessment / إنهاء التقييم':'Next Question / السؤال التالي';document.getElementById('next').onclick=()=>{if(selected===null)return;if(selected===q[3])score++;i++;if(i<questions.length)render();else finish()}}function finish()"""
          ns,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1:
              raise SystemExit(f'assessment patch expected 1 match, got {n}')
          p.write_text(ns,encoding='utf-8')

          # Challenge: preserve the selected questions and all content, but randomize answer choices per attempt.
          p=Path('frontend/script.js')
          s=p.read_text(encoding='utf-8')
          old="let index=0,score=0;const app=document.querySelector('#challengeApp');function render()"
          new="let index=0,score=0;pick=pick.map(function(q){var order=[0,1,2,3];for(var j=order.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=order[j];order[j]=order[k];order[k]=t;}return Object.assign({},q,{options:{en:order.map(function(i){return q.options.en[i];}),ar:order.map(function(i){return q.options.ar[i];})},correctAnswer:order.indexOf(q.correctAnswer)});});const app=document.querySelector('#challengeApp');function render()"
          if old not in s:
              raise SystemExit('challenge insertion point not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "function shuffleAssessmentOptions" frontend/course-assessment-v2.html
          grep -q "pick=pick.map(function(q)" frontend/script.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/course-assessment-v2.html frontend/script.js
          git commit -m "Randomize assessment and challenge answer choices"
          git push
