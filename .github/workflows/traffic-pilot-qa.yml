name: Traffic pilot static QA
on:
  push:
    branches:
      - feat/self-study-traffic-course
    paths:
      - 'scripts/verify_traffic_pilot.js'
      - 'backend/self-study-traffic-config.js'
      - 'frontend/fire-safety-self-study.html'
      - 'frontend/assets/traffic-videos/**'
      - '.github/workflows/traffic-pilot-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic-static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pilot configuration and training assets
        run: node scripts/verify_traffic_pilot.js
