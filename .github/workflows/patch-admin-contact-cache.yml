name: Refresh Contact Admin Script

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Add cache buster to contact admin script
        shell: python
        run: |
          from pathlib import Path
          p=Path('frontend/admin.html')
          text=p.read_text(encoding='utf-8')
          old='<script src="contact-admin.js"></script>'
          new='<script src="contact-admin.js?v=20260913-1534"></script>'
          if old not in text:
              raise SystemExit('Expected contact-admin script tag not found')
          text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')
      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/admin.html
          git commit -m "Refresh contact admin script cache"
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/patch-admin-contact-cache.yml
          git commit -m "Remove temporary cache refresh workflow"
          git push
