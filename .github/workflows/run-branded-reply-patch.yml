name: Run Branded Reply Patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python scripts/patch_branded_replies.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js frontend/contact-admin.js
          git diff --cached --quiet || git commit -m "Enable branded HTML admin replies"
          git push
      - name: Remove patch files
        run: |
          git rm scripts/patch_branded_replies.py .github/workflows/run-branded-reply-patch.yml
          git commit -m "Remove temporary branded reply patch files"
          git push
