name: Wire Admin Center
on:
  push:
    paths:
      - '.github/workflows/wire-admin-center.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Admin center and site content
        run: |
          python -c "from pathlib import Path;p=Path('frontend/admin.html');s=p.read_text(encoding='utf-8');tag='<script src=\\\"admin-center.js?v=20260915\\\"></script>';mark='<script src=\\\"contact-admin.js?v=20260914-admin-2\\\"></script>';p.write_text(s if tag in s or mark not in s else s.replace(mark,tag+'\\n'+mark),encoding='utf-8')"
          python -c "from pathlib import Path;p=Path('backend/overrides.js');s=p.read_text(encoding='utf-8');old=\"const ctrlAuth=req=>String(req.headers.authorization||'').startsWith('Bearer ')&&String(req.headers.authorization||'').slice(7).trim().length>20;\";new=\"const ctrlAuth=async req=>{try{const h=String(req.headers.authorization||'');if(!h.startsWith('Bearer '))return false;const r=await fetch('http://127.0.0.1:'+(process.env.PORT||10000)+'/api/admin/me',{headers:{Authorization:h}});return r.ok}catch{return false}};\";s=s.replace(old,new).replace('if(!ctrlAuth(req))return','if(!(await ctrlAuth(req)))return');p.write_text(s,encoding='utf-8')"
          python -c "from pathlib import Path;p=Path('frontend/config.js');s=p.read_text(encoding='utf-8');mark='ADMIN_SITE_CONTENT_SYNC_V3';extra=\"\\n// ADMIN_SITE_CONTENT_SYNC_V3\\n(function(){function sync(){fetch('https://security-instructor.onrender.com/api/site-content',{cache:'no-store'}).then(function(r){return r.ok?r.json():[]}).then(function(a){(a||[]).forEach(function(v){document.querySelectorAll('[data-content-key=\\\"'+String(v.key||'').replace(/\\\"/g,'&quot;')+'\\\"]').forEach(function(e){e.setAttribute('data-en',v.en||e.getAttribute('data-en')||'');e.setAttribute('data-ar',v.ar||e.getAttribute('data-ar')||'');e.textContent=(document.documentElement.lang==='ar'?v.ar:v.en)||e.textContent})})}).catch(function(){})}window.addEventListener('DOMContentLoaded',function(){sync();setTimeout(sync,900)})})();\";p.write_text(s if mark in s else s+extra,encoding='utf-8')"
          python -c "from pathlib import Path;p=Path('frontend/index.html');s=p.read_text(encoding='utf-8');r={'class=\\\"eyebrow\\\"':'class=\\\"eyebrow\\\" data-content-key=\\\"homeEyebrow\\\"','<h2>Abdallah Abdelaziz Shalaby</h2>':'<h2 data-content-key=\\\"homeName\\\">Abdallah Abdelaziz Shalaby</h2>','class=\\\"role\\\"':'class=\\\"role\\\" data-content-key=\\\"homeRole\\\"','class=\\\"hero-intro\\\"':'class=\\\"hero-intro\\\" data-content-key=\\\"homeIntro\\\"','class=\\\"hero-quote\\\"':'class=\\\"hero-quote\\\" data-content-key=\\\"homeQuote\\\"'};[(globals().__setitem__('s',s.replace(a,b,1))) for a,b in r.items()];p.write_text(globals()['s'],encoding='utf-8')"
          git config user.name 'SecurityTrainer2025'
          git config user.email 'abdallahabdalaziz@yahoo.com'
          git add frontend/admin.html backend/overrides.js frontend/config.js frontend/index.html
          git diff --cached --quiet || (git commit -m 'Secure and extend Admin control center' && git push)
