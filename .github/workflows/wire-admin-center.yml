name: Wire Admin Center
on:
  push:
    paths:
      - '.github/workflows/wire-admin-center.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Admin center and content management
        run: |
          python -c "from pathlib import Path;p=Path('frontend/admin.html');s=p.read_text(encoding='utf-8');tag='<script src=\\\"admin-center.js?v=20260915\\\"></script>';mark='<script src=\\\"contact-admin.js?v=20260914-admin-2\\\"></script>';p.write_text(s if tag in s or mark not in s else s.replace(mark,tag+'\\n'+mark),encoding='utf-8')"
          python -c "from pathlib import Path;p=Path('backend/overrides.js');s=p.read_text(encoding='utf-8');s=s.replace(\"if(req.method!=='GET'&&!ctrlAuth(req))return\",\"if(req.method!=='GET'&&!(await ctrlAuth(req)))return\");p.write_text(s,encoding='utf-8')"
          python -c "from pathlib import Path;p=Path('frontend/config.js');s=p.read_text(encoding='utf-8');mark='ADMIN_SITE_CONTENT_SYNC_V4';extra=\"\\n// ADMIN_SITE_CONTENT_SYNC_V4\\n(function(){function sync(){fetch('https://security-instructor.onrender.com/api/site-content',{cache:'no-store'}).then(function(r){return r.ok?r.json():[]}).then(function(a){(a||[]).forEach(function(v){document.querySelectorAll('[data-content-key=\\\"'+String(v.key||'').replace(/\\\"/g,'&quot;')+'\\\"]').forEach(function(e){e.setAttribute('data-en',v.en||e.getAttribute('data-en')||'');e.setAttribute('data-ar',v.ar||e.getAttribute('data-ar')||'');e.textContent=(document.documentElement.lang==='ar'?v.ar:v.en)||e.textContent})})}).catch(function(){})}window.addEventListener('DOMContentLoaded',function(){sync();setTimeout(sync,900)})})();\";p.write_text(s if mark in s else s+extra,encoding='utf-8')"
          python -c "from pathlib import Path;p=Path('frontend/index.html');s=p.read_text(encoding='utf-8');r={'<h2 data-en=\\\"About Me\\\" data-ar=\\\"نبذة عني\\\">About Me</h2>':'<h2 data-content-key=\\\"aboutTitle\\\" data-en=\\\"About Me\\\" data-ar=\\\"نبذة عني\\\">About Me</h2>','class=\\\"lead\\\"':'class=\\\"lead\\\" data-content-key=\\\"aboutLead\\\"','<h2 data-en=\\\"Professional Experience\\\" data-ar=\\\"الخبرة المهنية\\\">Professional Experience</h2>':'<h2 data-content-key=\\\"experienceTitle\\\" data-en=\\\"Professional Experience\\\" data-ar=\\\"الخبرة المهنية\\\">Professional Experience</h2>','<h2 data-en=\\\"Training Areas\\\" data-ar=\\\"مجالات التدريب\\\">Training Areas</h2>':'<h2 data-content-key=\\\"trainingTitle\\\" data-en=\\\"Training Areas\\\" data-ar=\\\"مجالات التدريب\\\">Training Areas</h2>','<h2 data-en=\\\"Training & Professional Gallery\\\" data-ar=\\\"معرض التدريب والأعمال\\\">Training & Professional Gallery</h2>':'<h2 data-content-key=\\\"galleryTitle\\\" data-en=\\\"Training & Professional Gallery\\\" data-ar=\\\"معرض التدريب والأعمال\\\">Training & Professional Gallery</h2>','<h2 data-en=\\\"Courses & Training\\\" data-ar=\\\"الدورات التدريبية\\\">Courses & Training</h2>':'<h2 data-content-key=\\\"coursesTitle\\\" data-en=\\\"Courses & Training\\\" data-ar=\\\"الدورات التدريبية\\\">Courses & Training</h2>','<h2 data-en=\\\"Projects & Ideas\\\" data-ar=\\\"المشاريع والأفكار\\\">Projects & Ideas</h2>':'<h2 data-content-key=\\\"projectsTitle\\\" data-en=\\\"Projects & Ideas\\\" data-ar=\\\"المشاريع والأفكار\\\">Projects & Ideas</h2>'};[(globals().__setitem__('s',s.replace(a,b,1))) for a,b in r.items()];p.write_text(globals()['s'],encoding='utf-8')"
          git config user.name 'SecurityTrainer2025'
          git config user.email 'abdallahabdalaziz@yahoo.com'
          git add frontend/admin.html backend/overrides.js frontend/config.js frontend/index.html
          git diff --cached --quiet || (git commit -m 'Complete secure Admin content wiring' && git push)
