<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feedback & Questions | SECURITY INSTRUCTOR</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bilingual.css">
<style>
:root{--navy:#0B1F33;--navy2:#102A43;--gold:#C8A96B}body{margin:0;background:#f3f5f7;color:var(--navy);font-family:Arial,Helvetica,sans-serif}.hero{padding:30px 18px;background:linear-gradient(135deg,#081725,#102A43);color:#fff;border-bottom:3px solid var(--gold);text-align:center}.hero h1{margin:8px 0}.wrap{max-width:760px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid #d5dce2;padding:24px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bcc6cf;border-radius:2px;font:inherit}.field textarea{min-height:110px;resize:vertical}.rating{display:flex;gap:10px;flex-wrap:wrap}.rating label{border:1px solid #c5cdd5;padding:10px 14px;cursor:pointer}.btn{background:var(--navy);border:1px solid var(--gold);color:#fff;padding:13px 18px;font-weight:700;cursor:pointer;width:100%}.muted{color:#5b6975;line-height:1.7}.msg{margin-top:15px;padding:12px;background:#eef5ed;border:1px solid #9abb91;display:none}.msg.error{background:#fff0f0;border-color:#d99}.context{font-size:13px;color:#5b6975;background:#f2f4f6;padding:10px}@media(max-width:520px){.card{padding:16px}.rating label{flex:1;text-align:center}}
</style></head><body>
<header class="hero"><p style="color:#C8A96B;font-size:12px;font-weight:800;letter-spacing:.1em">SECURITY INSTRUCTOR</p><h1 data-en="Feedback & Questions" data-ar="التقييم والملاحظات والأسئلة">التقييم والملاحظات والأسئلة</h1><p data-en="Help us improve your learning experience." data-ar="ساعدنا على تحسين تجربتك التعليمية.">ساعدنا على تحسين تجربتك التعليمية.</p><button id="langBtn" class="btn" style="max-width:150px;background:transparent;border-color:#C8A96B">العربية / English</button></header>
<main class="wrap"><form class="card" id="feedbackForm"><div class="context" id="contextLabel">سيتم ربط ملاحظتك بالدورة أو الورشة المحددة.</div>
<div class="field"><label for="sourceType">النوع / Type</label><select id="sourceType" required><option value="course">دورة / Course</option><option value="workshop">ورشة عمل / Workshop</option></select></div>
<div class="field"><label for="slug">رمز الدورة أو الورشة / Course or workshop code</label><input id="slug" required maxlength="100" pattern="[a-z0-9-]{2,100}" placeholder="e.g. fire-safety-emergency-response"></div>
<div class="field"><label for="sourceTitle">اسم الدورة أو الورشة (اختياري) / Title (optional)</label><input id="sourceTitle" maxlength="180"></div>
<div class="field"><label>تقييم تجربتك / Rate your experience</label><div class="rating" dir="ltr"><label><input type="radio" name="rating" value="1"> 1 ★</label><label><input type="radio" name="rating" value="2"> 2 ★</label><label><input type="radio" name="rating" value="3"> 3 ★</label><label><input type="radio" name="rating" value="4"> 4 ★</label><label><input type="radio" name="rating" value="5"> 5 ★</label></div></div>
<div class="field"><label for="note">ملاحظاتك / Your feedback</label><textarea id="note" maxlength="1000" placeholder="ما الذي كان مفيدًا؟ وما الذي يمكن تحسينه؟ / What worked well and what could improve?"></textarea></div>
<div class="field"><label for="question">سؤال للمدرب أو فريق SI (اختياري) / Question (optional)</label><textarea id="question" maxlength="1000"></textarea></div>
<button class="btn" type="submit" id="submitBtn">إرسال الملاحظات / Submit feedback</button><div class="msg" id="message" role="status"></div><p class="muted">لا تُدخل أرقام هوية أو بيانات شخصية حساسة. / Do not include ID numbers or sensitive personal information.</p></form></main>
<script>
(function(){const API='https://security-instructor.onrender.com';const p=new URLSearchParams(location.search);const $=id=>document.getElementById(id);const dict={ar:{title:'التقييم والملاحظات والأسئلة',intro:'ساعدنا على تحسين تجربتك التعليمية.',submit:'إرسال الملاحظات',type:'النوع',course:'دورة',workshop:'ورشة عمل',thanks:'شكرًا لك. تم استلام ملاحظاتك.',fail:'تعذر إرسال الملاحظات الآن. حاول مرة أخرى لاحقًا.',context:'سيتم ربط ملاحظتك بالدورة أو الورشة المحددة.'},en:{title:'Feedback & Questions',intro:'Help us improve your learning experience.',submit:'Submit feedback',type:'Type',course:'Course',workshop:'Workshop',thanks:'Thank you. Your feedback was received.',fail:'Feedback could not be sent. Please try again later.',context:'Your feedback will be linked to the selected course or workshop.'}};let lang='ar';function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-en][data-ar]').forEach(e=>e.textContent=e.dataset[l]);$('submitBtn').textContent=dict[l].submit;$('contextLabel').textContent=dict[l].context} $('langBtn').onclick=()=>setLang(lang==='ar'?'en':'ar');const type=p.get('type'),slug=p.get('slug'),title=p.get('title');if(['course','workshop'].includes(type))$('sourceType').value=type;if(slug&&/^[a-z0-9-]{2,100}$/.test(slug))$('slug').value=slug;if(title)$('sourceTitle').value=title.slice(0,180);function show(t,error){$('message').textContent=t;$('message').className='msg'+(error?' error':'');$('message').style.display='block'}$('feedbackForm').addEventListener('submit',async e=>{e.preventDefault();const rating=document.querySelector('input[name="rating"]:checked');const body={sourceType:$('sourceType').value,slug:$('slug').value.trim(),sourceCode:$('slug').value.trim(),sourceTitle:$('sourceTitle').value.trim(),rating:rating?Number(rating.value):null,note:$('note').value.trim(),question:$('question').value.trim()};$('submitBtn').disabled=true;try{const r=await fetch(API+'/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||dict[lang].fail);show(dict[lang].thanks,false);$('feedbackForm').reset();if(type)$('sourceType').value=type;if(slug)$('slug').value=slug;if(title)$('sourceTitle').value=title.slice(0,180)}catch(err){show(err.message||dict[lang].fail,true)}finally{$('submitBtn').disabled=false}});setLang('ar')})();
</script></body></html>
