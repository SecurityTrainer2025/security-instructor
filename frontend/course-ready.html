<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Available Course | SECURITY INSTRUCTOR</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bilingual.css"><style>:root{--n:#0B1F33;--n2:#102A43;--g:#c8a96b;--w:#fff;--m:#cbd5df;--l:#294158}body{background:var(--n);color:var(--w)}.wrap{max-width:1180px;margin:auto;padding:30px 5% 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--l);padding-bottom:18px}.back,.btn{border:1px solid var(--g);padding:11px 15px;text-decoration:none;color:#fff;font-weight:800}.hero{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.1fr);gap:36px;align-items:center;padding:35px 0}.hero img{width:100%;max-height:430px;object-fit:cover;border:1px solid var(--g);padding:6px;background:var(--n2)}.eyebrow{color:var(--g);font-size:13px;font-weight:800;letter-spacing:.1em}.title{font-size:clamp(30px,4vw,50px);line-height:1.08;margin:10px 0}.ar{direction:rtl;text-align:right;font-family:Tahoma,Arial,sans-serif}.title-ar{font-size:clamp(23px,3vw,34px);font-weight:800;color:#e7edf2;line-height:1.45}.status{display:inline-block;margin-top:18px;border:1px solid var(--g);padding:8px 13px;color:var(--g);font-weight:800}.intro{color:var(--m);line-height:1.8;font-size:17px}.section{margin-top:38px}.section h2{font-size:28px;margin-bottom:18px}.section h2 small{display:block;color:#dbe2e8;font-size:20px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--n2);border:1px solid var(--l);padding:23px}.panel h3{color:var(--g);margin-top:0}.panel li{margin-bottom:13px;line-height:1.6}.panel.ar{font-family:Tahoma,Arial,sans-serif}.modules{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.module{background:#0d2439;border:1px solid var(--l);padding:17px;min-height:150px}.module b{display:block;color:var(--g);margin-bottom:10px}.module span{display:block;line-height:1.5}.module .ar{margin-top:10px;color:#dbe2e8}.practical{border:1px solid var(--g);background:var(--n2);padding:25px;color:#dbe2e8;line-height:1.8}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.primary{background:var(--g);color:#101820}.secondary{background:transparent;color:#fff}@media(max-width:850px){.hero,.grid{grid-template-columns:1fr}.modules{grid-template-columns:1fr 1fr}}@media(max-width:520px){.modules{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:12px}}</style></head><body><div class="wrap"><header class="top"><strong>SI &nbsp; SECURITY INSTRUCTOR</strong><a class="back" href="index.html#courses">← Back to Courses / العودة للدورات</a></header><main id="course"></main></div><script>const courses={
'vehicle-search-security-inspection':{en:'VEHICLE SEARCH & SECURITY INSPECTION',ar:'تفتيش المركبات والتفتيش الأمني',image:'assets/courses/01_Traffic_Management_Vehicle_Control.jpg',introEn:'A professional practical course covering vehicle search procedures, access-control search bays, inspection technologies, systematic search sequences and incident response.',introAr:'دورة تدريبية عملية ومهنية تتناول إجراءات تفتيش المركبات، ومنصات التفتيش عند نقاط الدخول، وتقنيات الفحص، ومنهجية التفتيش المنظمة، والاستجابة للحوادث.',objectivesEn:['Apply the 10-point vehicle search sequence systematically and securely.','Evaluate vehicle search legal limits and understand consent principles.','Manage driver search refusals calmly without initiating physical conflict.','Deploy advanced contraband and explosive trace detection technologies.','Design and optimize an access control search bay for traffic flow.'],objectivesAr:['تطبيق المنهجية العشرية المنظمة لتفتيش المركبات بشكل آمن ومحترف.','تقييم الحدود القانونية لتفتيش المركبات وفهم مبدأ الموافقة والامتناع.','إدارة حالات امتناع السائقين عن التفتيش بهدوء وحزم وبدون احتكاك مادي.','تشغيل تقنيات كشف الممنوعات المتقدمة وكشف أثر المتفجرات ميدانيًا.','التصميم والتحكم الهندسي بمسارات منصة تفتيش المركبات وتنظيم المرور.'],modules:[['01','Legal Framework, Authority & Consent Principles','الإطار القانوني والصلاحيات ومبادئ الموافقة'],['02','Checkpoint & Search Bay Architectural Design','التصميم الهندسي لمنصات التفتيش وممرات البوابات'],['03','Modern Search Tools, Technologies & Canines','أدوات التفتيش الحديثة والتقنيات وفرق K9'],['04','10-Point Systematic Vehicle Search Sequence','المنهجية العشرية لتفتيش المركبات'],['05','Practical Exercises, Quizzes & Incident Response','التمارين التطبيقية والتقييم والاستجابة للحوادث']]},
'person-search-security-screening':{en:'PERSON SEARCH & SECURITY SCREENING',ar:'تفتيش الأشخاص وإجراءات التفتيش الأمني',image:'assets/courses/05_Person_Search_Security_Screening.jpg',introEn:'A professional practical course covering person-search procedures, screening-point design, security screening technologies, physical search methods and prohibited-item handling.',introAr:'دورة تدريبية عملية ومهنية تتناول إجراءات تفتيش الأشخاص، وتصميم نقاط الفحص، وتقنيات التفتيش الأمني، ومنهجية التفتيش الجسدي، والتعامل مع المواد الممنوعة.',objectivesEn:['Apply the 8-zone physical body search technique methodically and professionally.','Understand legal boundaries of person searches and female search protocols.','Design and manage a 5-zone security screening point layout.','Operate walkthrough (WTMD) and handheld (HHMD) metal detectors correctly.','Interpret baggage X-ray scanner color images to detect hidden contraband.'],objectivesAr:['تطبيق المنهجية الثمانية للتفتيش الجسدي المنظم بطريقة مهنية محترفة.','فهم الجوانب القانونية الحاكمة لتفتيش الأفراد وبروتوكولات تفتيش النساء.','هندسة وإدارة نقاط التفتيش الأمني الميدانية باستخدام نظام المناطق الخمس.','تشغيل ومعايرة البوابات الأمنية وأجهزة الكشف اليدوية عن المعادن.','تفسير وتحليل دلالات ألوان صور أجهزة كشف الحقائب بالأشعة السينية كشفًا للمخاطر.'],modules:[['01','Search Regulations, Legal Boundaries & Consent','اللوائح والحدود القانونية ومفهوم الموافقة'],['02','Security Checkpoint & 5-Zone Screening Point Layout','تصميم نقطة التفتيش ونظام المناطق الخمس'],['03','Security Screening Technologies & Tool Operation','تقنيات التفتيش الأمني وتشغيل المعدات'],['04','8-Zone Physical Body Search & Baggage Inspection','التفتيش الجسدي بالمناطق الثمانية وتفتيش الحقائب'],['05','Prohibited Items Processing & Evidence Handling Procedures','التعامل مع الممنوعات وتوثيق الأدلة وإجراءات حفظها']]}};
const slug=new URLSearchParams(location.search).get('course')||'vehicle-search-security-inspection';const c=courses[slug]||courses['vehicle-search-security-inspection'];const li=a=>a.map(x=>`<li>${x}</li>`).join('');document.getElementById('course').innerHTML=`<section class="hero"><div><img src="${c.image}" alt="${c.en}"></div><div><div class="eyebrow">SECURITY INSTRUCTOR • AVAILABLE COURSE</div><h1 class="title">${c.en}</h1><div class="title-ar ar">${c.ar}</div><span class="status">AVAILABLE / متاحة الآن</span><p class="intro">${c.introEn}</p><p class="intro ar">${c.introAr}</p></div></section><section class="section"><h2>Learning Objectives <small class="ar">أهداف الدورة</small></h2><div class="grid"><div class="panel"><h3>English</h3><ul>${li(c.objectivesEn)}</ul></div><div class="panel ar"><h3>العربية</h3><ul>${li(c.objectivesAr)}</ul></div></div></section><section class="section"><h2>Course Modules <small class="ar">وحدات الدورة</small></h2><div class="modules">${c.modules.map(m=>`<div class="module"><b>MODULE ${m[0]}</b><span>${m[1]}</span><span class="ar">${m[2]}</span></div>`).join('')}</div></section><section class="section"><h2>Practical Training <small class="ar">التدريب العملي</small></h2><div class="practical"><strong>Learn → Practice → Demonstrate → Apply</strong><br>Training connects professional knowledge with practical exercises, realistic scenarios and hands-on application.<br><span class="ar">يربط التدريب بين المعرفة المهنية والتمارين العملية والسيناريوهات الواقعية والتطبيق المباشر.</span></div></section><div class="actions"><a class="btn primary" href="course-assessment.html?course=${slug}">Initial Course Assessment / التقييم المبدئي للدورة</a><a class="btn secondary" href="index.html#courses">Back to Courses / العودة للدورات</a></div>`;</script></body></html>
