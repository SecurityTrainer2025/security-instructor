.notice{margin-top:16px;padding:12px 15px;border-left:3px solid var(--gold);background:#102A43;color:#e0e6eb;line-height:1.6;font-size:13px}.notice.ar{border-left:0;border-right:3px solid var(--gold);direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}
.stats{margin-top:20px;background:linear-gradient(135deg,#102A43,#0d2439);border:1px solid #294158;padding:20px}.stats-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.stats h2{margin:0;color:#fff;font-size:26px}.stats h2 small{display:block;margin-top:4px;color:#fff;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:19px}.stats-sub{color:#d5dde5;margin:0;font-size:13px}.stats-content{display:grid;grid-template-columns:1.25fr .85fr;gap:18px;align-items:stretch}.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b2034;border:1px solid #294158;padding:13px 8px;text-align:center;min-height:112px}.stat .icon{font-size:23px;color:#f1b94d}.stat .label-en{color:var(--gold);font-size:11px;font-weight:900;margin-top:4px}.stat .value{font-size:25px;font-weight:900;color:#fff;margin:5px 0}.stat .label-ar{color:#fff;font-size:12px;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl}.rating-box{border-left:1px solid #718191;padding-left:18px}.rating-title{color:var(--gold);font-weight:900;font-size:13px}.stars{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.star-btn{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:7px 11px;cursor:pointer;font-weight:900}.star-btn:hover,.star-btn.active{background:var(--gold);color:#101820}.feedback-label{display:block;color:#fff;font-size:12px;margin-top:12px}.feedback-input{width:100%;min-height:58px;margin-top:6px;resize:vertical;border:1px solid #718191;background:#f8fafb;color:#0b1f33;padding:9px;font:13px Arial}.feedback-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}.counter{color:#cbd5df;font-size:10px}.send-btn{border:1px solid var(--gold);background:var(--gold);color:#101820;padding:8px 14px;font-weight:900;cursor:pointer}.rating-msg{margin-top:7px;color:#d5dde5;font-size:12px;min-height:16px}
.assessment-top{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.action{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:12px 18px;font-weight:900;border:1px solid var(--gold);font-size:13px}.primary{background:var(--gold);color:#101820}.secondary{color:#fff;background:transparent}.action:hover{transform:translateY(-1px)}
@media(max-width:900px){.course-hero{grid-template-columns:1fr;min-height:0}.course-image{height:330px}.objectives-grid{grid-template-columns:1fr}.modules{grid-template-columns:repeat(2,1fr)}.stats-content{grid-template-columns:1fr}.rating-box{border-left:0;border-top:1px solid #718191;padding:15px 0 0}.nav{gap:13px}.nav a:nth-child(-n+3){display:none}}
@media(max-width:600px){.details-wrap{padding:0 12px 35px}.sitebar{height:auto;padding:13px 2px}.brand{font-size:13px}.nav{gap:10px}.course-hero{padding:18px 5px 22px;gap:18px}.course-image{height:250px}.title-en{font-size:30px}.title-ar{font-size:23px}.intro{font-size:14px}.section-block{padding:17px 13px;margin-top:16px}.section-head{align-items:flex-start}.section-title{font-size:22px}.section-ar{font-size:19px}.modules{grid-template-columns:1fr}.module{min-height:0;padding:15px}.practical{grid-template-columns:1fr}.practical img{height:190px}.stats{padding:14px}.stats-grid{grid-template-columns:repeat(2,1fr)}.stats h2{font-size:22px}.footer-actions{flex-direction:column}.action{width:100%}}

<script>
const API='https://security-instructor.onrender.com';
const courses={
"traffic-management-vehicle-control":{en:"TRAFFIC MANAGEMENT & VEHICLE CONTROL",ar:"إدارة حركة المرور والتحكم في المركبات في الموقع",image:"assets/courses/04_Vehicle_Search_Security_Inspection.jpg",introEn:"A practical course focused on professional site traffic management, vehicle and pedestrian control, standardized hand signals, whistle commands, parking management and traffic calming.",introAr:"دورة عملية تركز على الإدارة المهنية لحركة المرور في مواقع العمل، وتنظيم حركة المركبات والمشاة، والإشارات اليدوية القياسية، وأوامر الصافرة، وإدارة المواقف وتهدئة حركة المرور.",objectivesEn:["Understand the importance of professional site traffic management.","Identify various categories of vehicular and pedestrian traffic.","Master the 6 basic traffic hand signals and whistle codes.","Enforce strict parking rules and deploy parking lot technologies.","Apply traffic calming measures to reduce vehicle speed and accidents."],objectivesAr:["فهم الأهمية البالغة لإدارة وتنظيم حركة المرور في مواقع العمل الحيوية.","تحديد وفصل الفئات المختلفة لحركة المركبات والمشاة لحفظ السلامة.","إتقان الحركات والإشارات الست الأساسية لتوجيه المرور يدويًا وإشارات الصافرة.","تطبيق قواعد المواقف الصارمة وتوظيف تقنيات إدارة المواقف الحديثة.","تطبيق تدابير تهدئة حركة المرور الهندسية لخفض السرعات والحد من الحوادث."],modules:[["Fundamentals of Traffic Control & Roadway Positions","أساسيات التحكم في حركة المرور ومواقع الوقوف على الطرق"],["Standard Hand Signals & Whistle Code Commands","الإشارات اليدوية القياسية وأوامر الصافرة"],["Traffic Responsibilities, Gate Duty, & Safety Equipment","مسؤوليات تنظيم المرور ومهام البوابات ومعدات السلامة"],["Site Traffic Plans, Separation, & Inductions","خطط حركة المرور بالموقع والفصل والتعريف بإجراءات السلامة"],["Parking Management Technologies & Traffic Calming","تقنيات إدارة المواقف وتهدئة حركة المرور"]]},
"crowd-management-event-security":{en:"CROWD MANAGEMENT & EVENT SECURITY",ar:"إدارة الحشود وتأمين الفعاليات والمناسبات الكبرى",image:"assets/courses/02_Crowd_Management_Event_Security.jpg",introEn:"A practical course covering crowd dynamics, behaviour analysis, control measures, event formations, access control and screening in Gulf environments.",introAr:"دورة عملية تتناول ديناميكيات الحشود، وتحليل السلوك، وتدابير السيطرة، والتشكيلات الأمنية للفعاليات، وتنظيم الدخول والتفتيش في بيئات الخليج العربي.",objectivesEn:["Understand the basic concepts of crowd dynamics and group psychology.","Analyze different categories of crowds and expect their behaviors.","Apply 8 scientific countermeasures to control hostile and unruly crowds.","Deploy basic riot and crowd control formations in special events.","Implement strict access control and screening policies in Gulf environments."],objectivesAr:["فهم المفاهيم الأساسية لديناميكيات الحشود وعلم نفس الجماهير.","تحليل الفئات المختلفة للحشود وتوقع مسارات سلوكياتها بدقة.","تطبيق 8 تدابير مضادة علمية للسيطرة على الحشود المشاغبة والعدائية.","نشر وتشكيل قوات مكافحة الشغب والسيطرة على الحشود في الفعاليات.","تطبيق سياسات صارمة لتنظيم الدخول والتفتيش تلائم بيئة الخليج العربي."],modules:[["Crowd Dynamics & Group Psychology","ديناميكيات الحشود وعلم نفس الجماهير"],["Crowd Categories & Behaviour Analysis","فئات الحشود وتحليل السلوك"],["Countermeasures for Hostile & Unruly Crowds","التدابير المضادة للحشود المشاغبة والعدائية"],["Crowd Control Formations for Events","تشكيلات السيطرة على الحشود في الفعاليات"],["Access Control & Screening Policies","سياسات تنظيم الدخول والتفتيش"]]},
"fire-safety-emergency-response":{en:"FIRE SAFETY & EMERGENCY RESPONSE",ar:"السلامة من الحرائق وتدابير الاستجابة للطوارئ",image:"assets/courses/03_Fire_Safety_Emergency_Response.jpg",introEn:"A practical fire-safety course covering fire science, classifications, extinguishing agents, detection and alarm systems, tactical response, evacuation and incident command.",introAr:"دورة عملية في السلامة من الحرائق تتناول علم الحرائق وتصنيفاتها ووسائط الإطفاء وأنظمة الكشف والإنذار والاستجابة التكتيكية والإخلاء وقيادة الحوادث.",objectivesEn:["Master the core physics and chemistry of fire tetrahedron dynamics.","Identify fire classifications and select portable agents per NFPA 10.","Demonstrate proper response and validation of fire alarm systems.","Apply tactical countermeasures including RACE, arson prevention, and security.","Manage mass evacuations and incident command structures per NFPA 101."],objectivesAr:["إتقان المفاهيم الأساسية لكيمياء الحريق وديناميكيات رباعي الأوجه.","تصنيف أنواع الحرائق واختيار وسائط الإطفاء المناسبة بموجب NFPA 10.","تطبيق الاستجابة الصحيحة وتأكيد تنبيهات لوحات الكشف والإنذار.","تنفيذ تدابير الوقاية مثل RACE، ومكافحة الافتعال المتعمد، وتأمين المنشأة.","قيادة عمليات الإخلاء الجماعي وإدارة الحوادث بموجب معايير NFPA 101."],modules:[["Fundamentals of Fire Science & Building Hazards","أساسيات علم الحرائق ومخاطر المباني"],["Fire Classifications & Portable Extinguishing Agents","تصنيفات الحرائق ووسائط الإطفاء المحمولة"],["Fire Detection, Alarms & Suppression Systems","أنظمة الكشف والإنذار والإطفاء"],["Tactical Response & Facility Fire Plans","الاستجابة التكتيكية وخطط مكافحة الحرائق بالمنشآت"],["Emergency Evacuation & Incident Command","الإخلاء في حالات الطوارئ وقيادة الحوادث"]]},
"vehicle-search-security-inspection":{en:"VEHICLE SEARCH & SECURITY INSPECTION",ar:"تفتيش المركبات والتفتيش الأمني",image:"assets/courses/01_Traffic_Management_Vehicle_Control.jpg",introEn:"A professional practical course covering vehicle search procedures, access-control search bays, inspection technologies, systematic search sequences and incident response.",introAr:"دورة عملية مهنية تغطي إجراءات تفتيش المركبات، ومنصات التفتيش في نقاط التحكم بالدخول، وتقنيات التفتيش، والمنهجيات المنظمة للبحث والاستجابة للحوادث.",objectivesEn:["Apply the 10-point vehicle search sequence systematically and securely.","Evaluate vehicle search legal limits and understand consent principles.","Manage driver search refusals calmly without initiating physical conflict.","Deploy advanced contraband and explosive trace detection technologies.","Design and optimize an access control search bay for traffic flow."],objectivesAr:["تطبيق المنهجية العشرية المنظمة لتفتيش المركبات بشكل آمن ومحترف.","تقييم الحدود القانونية لتفتيش المركبات وفهم مبدأ الموافقة والامتناع.","إدارة حالات امتناع السائقين عن التفتيش بهدوء وحزم وبدون احتكاك مادي.","تشغيل تقنيات كشف الممنوعات المتقدمة وكشف أثر المتفجرات ميدانيًا.","التصميم والتحكم الهندسي بمسارات منصة تفتيش المركبات وتنظيم المرور."],modules:[["Legal Framework, Authority & Consent Principles","الإطار القانوني والصلاحيات ومبادئ الموافقة"],["Checkpoint & Search Bay Architectural Design","التصميم الهندسي لمنصات التفتيش وممرات البوابات"],["Modern Search Tools, Technologies & Canines","أدوات التفتيش الحديثة والتقنيات وكلاب K9"],["10-Point Systematic Vehicle Search Sequence","المنهجية العشرية لتفتيش المركبات"],["Practical Exercises, Quizzes & Incident Response","التمارين التطبيقية والتقييم والاستجابة للحوادث"]]},
"person-search-security-screening":{en:"PERSON SEARCH & SECURITY SCREENING",ar:"تفتيش الأشخاص وإجراءات التفتيش الأمني",image:"assets/courses/05_Person_Search_Security_Screening.jpg",introEn:"A professional practical course covering screening procedures, security technologies, structured physical search methods and prohibited-item handling.",introAr:"دورة عملية مهنية تغطي إجراءات الفحص الأمني، وتقنيات التفتيش، ومنهجيات التفتيش الجسدي المنظم، والتعامل مع المواد الممنوعة.",objectivesEn:["Apply the 8-zone physical body search technique methodically and professionally.","Understand legal boundaries of person searches and female search protocols.","Design and manage a 5-zone security screening point layout.","Operate walkthrough (WTMD) and handheld (HHMD) metal detectors correctly.","Interpret baggage X-ray scanner color images to detect hidden contraband."],objectivesAr:["تطبيق المنهجية الثمانية للتفتيش الجسدي المنظم بطريقة مهنية محترفة.","فهم الجوانب القانونية الحاكمة لتفتيش الأفراد وبروتوكولات تفتيش النساء.","هندسة وإدارة نقاط التفتيش الأمني الميدانية باستخدام نظام المناطق الخمس.","تشغيل ومعايرة البوابات الأمنية وأجهزة الكشف اليدوية عن المعادن.","تفسير وتحليل دلالات ألوان صور أجهزة كشف الحقائب بالأشعة السينية لكشف المخاطر المخبأة."],modules:[["Search Regulations, Legal Boundaries & Consent","أنظمة التفتيش والحدود القانونية والموافقة"],["Security Checkpoint & 5-Zone Screening Point Layout","نقاط التفتيش الأمني وتصميم نظام المناطق الخمس"],["Security Screening Technologies & Tool Operation","تقنيات الفحص الأمني وتشغيل المعدات"],["8-Zone Physical Body Search & Baggage Inspection","التفتيش الجسدي بنظام المناطق الثماني وتفتيش الحقائب"],["Prohibited Items Processing & Evidence Handling Procedures","إجراءات التعامل مع الممنوعات وحفظ الأدلة"]]}
};
const slug=new URLSearchParams(location.search).get('course')||'traffic-management-vehicle-control';const d=courses[slug]||courses['traffic-management-vehicle-control'];
function render(){const modules=d.modules.map((m,i)=>`<div class="module"><b>${String(i+1).padStart(2,'0')} <span style="float:right">▣</span></b><span class="en">${m[0]}</span><span class="ar">${m[1]}</span></div>`).join('');const en=d.objectivesEn.map(x=>`<li>${x}</li>`).join('');const ar=d.objectivesAr.map(x=>`<li>${x}</li>`).join('');document.getElementById('course').innerHTML=`<section class="course-hero"><div><img class="course-image" src="${d.image}" alt="${d.en}"></div><div><div class="eyebrow">SECURITY INSTRUCTOR • AVAILABLE COURSE</div><h1 class="title-en">${d.en}</h1><div class="title-ar">${d.ar}</div><div class="gold-line"></div><p class="intro">${d.introEn}</p><p class="intro ar">${d.introAr}</p><div class="status">AVAILABLE / متاحة الآن</div></div></section><section class="section-block"><div class="section-head"><h2 class="section-title"><span class="section-icon">◎</span> Learning Objectives</h2><div class="section-ar">أهداف الدورة <span class="section-icon">◎</span></div></div><div class="objectives-grid"><div class="panel"><h3>English</h3><ul>${en}</ul></div><div class="panel ar"><h3>العربية</h3><ul>${ar}</ul></div></div><div class="section-head" style="margin-top:18px"><h2 class="section-title"><span class="section-icon">▤</span> Course Modules</h2><div class="section-ar">وحدات الدورة <span class="section-icon">▤</span></div></div><div class="modules">${modules}</div><div class="section-head" style="margin-top:18px"><h2 class="section-title"><span class="section-icon">⚙</span> Practical Training</h2><div class="section-ar">التدريب العملي <span class="section-icon">⚙</span></div></div><div class="practical"><img src="${d.image}" alt="Practical training"><div class="practical-copy"><strong>Learn → Practice → Demonstrate → Apply</strong><p>Training connects professional knowledge with practical exercises, realistic scenarios and hands-on application.</p><p class="ar">يربط التدريب بين المعرفة المهنية والتمارين العملية والسيناريوهات الواقعية والتطبيق المباشر.</p></div></div></section><div class="notice">Public Preview: Selected course information is available publicly. Full training materials are not publicly downloadable.</div><div class="notice ar">المعاينة العامة: تتوفر معلومات مختارة عن الدورة للعامة، ولا تتاح المواد التدريبية الكاملة للتنزيل العام.</div><section class="stats"><div class="stats-head"><div><h2>Course Statistics <small>إحصائيات الدورة</small></h2><p class="stats-sub">Live course activity and learner ratings / نشاط الدورة وتقييمات المتدربين</p></div></div><div class="stats-content"><div class="stats-grid"><div class="stat"><div class="icon">◉</div><div class="label-en">Views</div><div class="value" id="views">—</div><div class="label-ar">المشاهدات</div></div><div class="stat"><div class="icon">↗</div><div class="label-en">Course Entries</div><div class="value" id="entries">—</div><div class="label-ar">مرات الدخول</div></div><div class="stat"><div class="icon">★</div><div class="label-en">Average Rating</div><div class="value" id="average">—</div><div class="label-ar">متوسط التقييم</div></div><div class="stat"><div class="icon">♟</div><div class="label-en">Rating Count</div><div class="value" id="count">—</div><div class="label-ar">عدد التقييمات</div></div></div><div class="rating-box"><div class="rating-title">Rate this course / قيّم هذه الدورة</div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star-btn" type="button" data-rate="${n}">★ ${n}</button>`).join('')}</div><label class="feedback-label">Add a short note (optional) / أضف ملاحظة مختصرة (اختياري)</label><textarea id="feedback" class="feedback-input" maxlength="300" placeholder="Write a short note... / اكتب ملاحظة مختصرة..."></textarea><div class="feedback-row"><span class="counter"><span id="chars">0</span>/300</span><button class="send-btn" id="sendFeedback" type="button">Send / إرسال</button></div><div class="rating-msg" id="ratingMsg">Select a rating / اختر تقييمًا</div></div></div></section><div class="assessment-top"><a class="action primary" href="course-assessment-v2.html?course=${encodeURIComponent(slug)}">▣ &nbsp; Initial Course Assessment / التقييم المبدئي للدورة</a></div><div class="footer-actions"><a class="action secondary" href="index.html#courses">← &nbsp; Back to Courses / العودة للدورات</a></div>`}
async function loadStats(){try{const r=await fetch(`${API}/api/course-stats/${encodeURIComponent(slug)}`);if(!r.ok)throw 0;const s=await r.json();document.getElementById('views').textContent=s.views??0;document.getElementById('entries').textContent=s.entries??0;document.getElementById('average').textContent=Number(s.averageRating??0).toFixed(1);document.getElementById('count').textContent=s.ratingCount??0}catch(e){document.getElementById('ratingMsg').textContent='Statistics service unavailable / خدمة الإحصائيات غير متاحة حاليًا'}}
async function entry(){try{await fetch(`${API}/api/course-stats/${encodeURIComponent(slug)}/entry`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){}}
async function rate(n){try{const r=await fetch(`${API}/api/course-stats/${encodeURIComponent(slug)}/rating`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating:n})});if(!r.ok)throw 0;document.querySelectorAll('.star-btn').forEach(b=>b.classList.toggle('active',Number(b.dataset.rate)===n));document.getElementById('ratingMsg').textContent='Thank you for your rating. / شكرًا لتقييمك.';loadStats()}catch(e){document.getElementById('ratingMsg').textContent='Rating service unavailable / خدمة التقييم غير متاحة حاليًا'}}
async function feedback(){const el=document.getElementById('feedback');const note=el.value.trim();if(!note){document.getElementById('ratingMsg').textContent='Please write a short note. / يرجى كتابة ملاحظة مختصرة.';return}try{const r=await fetch(`${API}/api/course-feedback/${encodeURIComponent(slug)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({note})});if(!r.ok)throw 0;el.value='';document.getElementById('chars').textContent='0';document.getElementById('ratingMsg').textContent='Thank you for your note. / شكرًا لملاحظتك.'}catch(e){document.getElementById('ratingMsg').textContent='Feedback service unavailable / خدمة الملاحظات غير متاحة حاليًا'}}
render();document.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>rate(Number(b.dataset.rate))));document.getElementById('feedback').addEventListener('input',e=>document.getElementById('chars').textContent=e.target.value.length);document.getElementById('sendFeedback').addEventListener('click',feedback);entry().finally(loadStats);
</script></body></html>
