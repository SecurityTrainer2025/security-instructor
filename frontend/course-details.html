<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Details | SECURITY INSTRUCTOR</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bilingual.css"><style>
:root{--navy:#0B1F33;--navy2:#102A43;--card:#0d2439;--gold:#c8a96b;--white:#fff;--muted:#cbd5df;--line:#294158}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#fff;font-family:Arial,Helvetica,sans-serif}.details-wrap{max-width:1180px;margin:auto;padding:30px 5% 70px}.details-top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:34px}.back-link{color:#fff;text-decoration:none;border:1px solid #718191;padding:10px 15px}.course-hero{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.05fr);gap:38px;align-items:center}.course-image{width:100%;height:430px;object-fit:cover;border:1px solid var(--gold);padding:6px;background:var(--navy2)}.eyebrow{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.1em}.title-en{font-size:clamp(32px,4vw,56px);line-height:1.02;margin:12px 0;color:#fff}.title-ar{font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:clamp(25px,3vw,38px);font-weight:800;line-height:1.35;color:#fff;margin:12px 0}.status{display:inline-block;margin-top:10px;border:1px solid var(--gold);padding:8px 13px;color:var(--gold);font-weight:800}.intro{font-size:17px;line-height:1.8;color:#dbe2e8;margin-top:20px}.intro.ar{direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.section-block{margin-top:48px}.section-title{font-size:29px;margin:0 0 22px;color:#fff}.section-title small{display:block;color:#fff;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:22px;margin-top:6px}.objectives-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--navy2);border:1px solid var(--line);padding:25px;color:#fff}.panel h3{margin:0 0 18px;color:var(--gold)}.panel.ar{direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.panel ul{margin:0;padding-left:24px}.panel.ar ul{padding-left:0;padding-right:24px}.panel li{margin:0 0 15px;line-height:1.65;color:#fff;font-size:16px}.modules{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.module{background:var(--card);border:1px solid var(--line);padding:18px 14px;min-height:190px;color:#fff}.module b{display:block;color:var(--gold);font-size:13px;margin-bottom:12px}.module .en{display:block;color:#fff;line-height:1.55;font-size:15px}.module .ar{display:block;margin-top:13px;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;color:#fff;line-height:1.65;font-size:15px}.practical{border:1px solid var(--gold);background:linear-gradient(135deg,#102A43,#132f49);padding:25px}.practical p{color:#fff;line-height:1.8;margin:7px 0}.practical .ar{direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.notice{margin-top:20px;border-left:3px solid var(--gold);padding:14px 18px;background:#102A43;color:#dbe2e8;line-height:1.7}.notice.ar{border-left:0;border-right:3px solid var(--gold);direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.stats{margin-top:44px;border:1px solid var(--line);background:#102A43;padding:25px}.stats-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.stats h2{margin:0;color:#fff;font-size:28px}.stats h2 small{display:block;margin-top:5px;color:#fff;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:21px}.stats-sub{color:#cbd5df;margin:0}.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#0d2439;border:1px solid var(--line);padding:17px 10px;text-align:center}.stat .label-en{color:var(--gold);font-size:12px;font-weight:800}.stat .value{font-size:27px;font-weight:900;color:#fff;margin:6px 0}.stat .label-ar{color:#fff;font-size:13px;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl}.rating-box{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}.rating-title{color:var(--gold);font-weight:800}.stars{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.star-btn{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:9px 14px;cursor:pointer;font-weight:800}.star-btn:hover{background:var(--gold);color:#101820}.rating-msg{margin-top:10px;color:#cbd5df;font-size:14px;min-height:18px}.footer-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}.action{display:inline-block;text-decoration:none;padding:13px 20px;font-weight:800;border:1px solid var(--gold)}.primary{background:var(--gold);color:#101820}.secondary{color:#fff;background:transparent}@media(max-width:900px){.course-hero,.objectives-grid{grid-template-columns:1fr}.modules{grid-template-columns:repeat(2,1fr)}.stats-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.modules,.stats-grid{grid-template-columns:1fr}.details-top{align-items:flex-start;flex-direction:column}.course-image{height:300px}}
</style></head><body><div class="details-wrap"><header class="details-top"><strong>SI &nbsp; SECURITY INSTRUCTOR</strong><a class="back-link" href="index.html#courses">← Back to Courses / العودة للدورات</a></header><main id="course"></main></div>
<script>
const API='https://security-instructor.onrender.com';
const courses={
"traffic-management-vehicle-control":{en:"TRAFFIC MANAGEMENT & VEHICLE CONTROL",ar:"إدارة حركة المرور والتحكم في المركبات في الموقع",image:"assets/courses/04_Vehicle_Search_Security_Inspection.jpg",introEn:"A practical course focused on professional site traffic management, vehicle and pedestrian control, standardized hand signals, whistle commands, parking management and traffic calming.",introAr:"دورة عملية تركز على الإدارة المهنية لحركة المرور في مواقع العمل، وتنظيم حركة المركبات والمشاة، والإشارات اليدوية القياسية، وأوامر الصافرة، وإدارة المواقف وتهدئة حركة المرور.",modules:[["Fundamentals of Traffic Control & Roadway Positions","أساسيات التحكم في حركة المرور ومواقع الوقوف على الطرق"],["Standard Hand Signals & Whistle Code Commands","الإشارات اليدوية القياسية وأوامر الصافرة"],["Traffic Responsibilities, Gate Duty, & Safety Equipment","مسؤوليات تنظيم المرور ومهام البوابات ومعدات السلامة"],["Site Traffic Plans, Separation, & Inductions","خطط حركة المرور بالموقع والفصل والتعريف بإجراءات السلامة"],["Parking Management Technologies & Traffic Calming","تقنيات إدارة المواقف وتهدئة حركة المرور"]],objectivesEn:["Understand the importance of professional site traffic management.","Identify various categories of vehicular and pedestrian traffic.","Master the 6 basic traffic hand signals and whistle codes.","Enforce strict parking rules and deploy parking lot technologies.","Apply traffic calming measures to reduce vehicle speed and accidents."],objectivesAr:["فهم الأهمية البالغة لإدارة وتنظيم حركة المرور في مواقع العمل الحيوية.","تحديد وفصل الفئات المختلفة لحركة المركبات والمشاة لحفظ السلامة.","إتقان الحركات والإشارات الست الأساسية لتوجيه المرور يدويًا وإشارات الصافرة.","تطبيق قواعد المواقف الصارمة وتوظيف تقنيات إدارة المواقف الحديثة.","تطبيق تدابير تهدئة حركة المرور الهندسية لخفض السرعات والحد من الحوادث."]},
"crowd-management-event-security":{en:"CROWD MANAGEMENT & EVENT SECURITY",ar:"إدارة الحشود وتأمين الفعاليات والمناسبات الكبرى",image:"assets/courses/02_Crowd_Management_Event_Security.jpg",introEn:"A practical course covering crowd dynamics, behaviour analysis, control measures, event formations, access control and screening in Gulf environments.",introAr:"دورة عملية تتناول ديناميكيات الحشود، وتحليل السلوك، وتدابير السيطرة، والتشكيلات الأمنية للفعاليات، وتنظيم الدخول والتفتيش في بيئات الخليج العربي.",modules:[["Crowd Dynamics & Group Psychology","ديناميكيات الحشود وعلم نفس الجماهير"],["Crowd Categories & Behaviour Analysis","فئات الحشود وتحليل السلوك"],["Countermeasures for Hostile & Unruly Crowds","التدابير المضادة للحشود المشاغبة والعدائية"],["Crowd Control Formations for Events","تشكيلات السيطرة على الحشود في الفعاليات"],["Access Control & Screening Policies","سياسات تنظيم الدخول والتفتيش"]],objectivesEn:["Understand the basic concepts of crowd dynamics and group psychology.","Analyze different categories of crowds and expect their behaviors.","Apply 8 scientific countermeasures to control hostile and unruly crowds.","Deploy basic riot and crowd control formations in special events.","Implement strict access control and screening policies in Gulf environments."],objectivesAr:["فهم المفاهيم الأساسية لديناميكيات الحشود وعلم نفس الجماهير.","تحليل الفئات المختلفة للحشود وتوقع مسارات سلوكياتها بدقة.","تطبيق 8 تدابير مضادة علمية للسيطرة على الحشود المشاغبة والعدائية.","نشر وتشكيل قوات مكافحة الشغب والسيطرة على الحشود في الفعاليات.","تطبيق سياسات صارمة لتنظيم الدخول والتفتيش تلائم بيئة الخليج العربي."]},
"fire-safety-emergency-response":{en:"FIRE SAFETY & EMERGENCY RESPONSE",ar:"السلامة من الحرائق وتدابير الاستجابة للطوارئ",image:"assets/courses/03_Fire_Safety_Emergency_Response.jpg",introEn:"A practical fire-safety course covering fire science, classifications, extinguishing agents, detection and alarm systems, tactical response, evacuation and incident command.",introAr:"دورة عملية في السلامة من الحرائق تتناول علم الحرائق وتصنيفاتها ووسائط الإطفاء وأنظمة الكشف والإنذار والاستجابة التكتيكية والإخلاء وقيادة الحوادث.",modules:[["Fundamentals of Fire Science & Building Hazards","أساسيات علم الحرائق ومخاطر المباني"],["Fire Classifications & Portable Extinguishing Agents","تصنيفات الحرائق ووسائط الإطفاء المحمولة"],["Fire Detection, Alarms & Suppression Systems","أنظمة الكشف والإنذار والإطفاء"],["Tactical Response & Facility Fire Plans","الاستجابة التكتيكية وخطط مكافحة الحرائق بالمنشآت"],["Emergency Evacuation & Incident Command","الإخلاء في حالات الطوارئ وقيادة الحوادث"]],objectivesEn:["Master the core physics and chemistry of fire tetrahedron dynamics.","Identify fire classifications and select portable agents per NFPA 10.","Demonstrate proper response and validation of fire alarm systems.","Apply tactical countermeasures including RACE, arson prevention, and security.","Manage mass evacuations and incident command structures per NFPA 101."],objectivesAr:["إتقان المفاهيم الأساسية لكيمياء الحريق وديناميكيات رباعي الأوجه.","تصنيف أنواع الحرائق واختيار وسائط الإطفاء المناسبة بموجب NFPA 10.","تطبيق الاستجابة الصحيحة وتأكيد تنبيهات لوحات الكشف والإنذار.","تنفيذ تدابير الوقاية مثل RACE، ومكافحة الافتعال المتعمد، وتأمين المنشأة.","قيادة عمليات الإخلاء الجماعي وإدارة الحوادث بموجب معايير NFPA 101."]},
"vehicle-search-security-inspection":{en:"VEHICLE SEARCH & SECURITY INSPECTION",ar:"تفتيش المركبات والتفتيش الأمني",image:"assets/courses/01_Traffic_Management_Vehicle_Control.jpg",introEn:"A professional practical course covering vehicle search procedures, access-control search bays, inspection technologies, systematic search sequences and incident response.",introAr:"دورة عملية مهنية تغطي إجراءات تفتيش المركبات، ومنصات التفتيش في نقاط التحكم بالدخول، وتقنيات التفتيش، والمنهجيات المنظمة للبحث والاستجابة للحوادث.",modules:[["Legal Framework, Authority & Consent Principles","الإطار القانوني والصلاحيات ومبادئ الموافقة"],["Checkpoint & Search Bay Architectural Design","التصميم الهندسي لمنصات التفتيش وممرات البوابات"],["Modern Search Tools, Technologies & Canines","أدوات التفتيش الحديثة والتقنيات وكلاب K9"],["10-Point Systematic Vehicle Search Sequence","المنهجية العشرية لتفتيش المركبات"],["Practical Exercises, Quizzes & Incident Response","التمارين التطبيقية والتقييم والاستجابة للحوادث"]],objectivesEn:["Apply the 10-point vehicle search sequence systematically and securely.","Evaluate vehicle search legal limits and understand consent principles.","Manage driver search refusals calmly without initiating physical conflict.","Deploy advanced contraband and explosive trace detection technologies.","Design and optimize an access control search bay for traffic flow."],objectivesAr:["تطبيق المنهجية العشرية المنظمة لتفتيش المركبات بشكل آمن ومحترف.","تقييم الحدود القانونية لتفتيش المركبات وفهم مبدأ الموافقة والامتناع.","إدارة حالات امتناع السائقين عن التفتيش بهدوء وحزم وبدون احتكاك مادي.","تشغيل تقنيات كشف الممنوعات المتقدمة وكشف أثر المتفجرات ميدانيًا.","التصميم والتحكم الهندسي بمسارات منصة تفتيش المركبات وتنظيم المرور."]},
"person-search-security-screening":{en:"PERSON SEARCH & SECURITY SCREENING",ar:"تفتيش الأشخاص وإجراءات التفتيش الأمني",image:"assets/courses/05_Person_Search_Security_Screening.jpg",introEn:"A professional practical course covering screening procedures, security technologies, structured physical search methods and prohibited-item handling.",introAr:"دورة عملية مهنية تغطي إجراءات الفحص الأمني، وتقنيات التفتيش، ومنهجيات التفتيش الجسدي المنظم، والتعامل مع المواد الممنوعة.",modules:[["Search Regulations, Legal Boundaries & Consent","أنظمة التفتيش والحدود القانونية والموافقة"],["Security Checkpoint & 5-Zone Screening Point Layout","نقاط التفتيش الأمني وتصميم نظام المناطق الخمس"],["Security Screening Technologies & Tool Operation","تقنيات الفحص الأمني وتشغيل المعدات"],["8-Zone Physical Body Search & Baggage Inspection","التفتيش الجسدي بنظام المناطق الثماني وتفتيش الحقائب"],["Prohibited Items Processing & Evidence Handling Procedures","إجراءات التعامل مع الممنوعات وحفظ الأدلة"]],objectivesEn:["Apply the 8-zone physical body search technique methodically and professionally.","Understand legal boundaries of person searches and female search protocols.","Design and manage a 5-zone security screening point layout.","Operate walkthrough (WTMD) and handheld (HHMD) metal detectors correctly.","Interpret baggage X-ray scanner color images to detect hidden contraband."],objectivesAr:["تطبيق المنهجية الثمانية للتفتيش الجسدي المنظم بطريقة مهنية محترفة.","فهم الجوانب القانونية الحاكمة لتفتيش الأفراد وبروتوكولات تفتيش النساء.","هندسة وإدارة نقاط التفتيش الأمني الميدانية باستخدام نظام المناطق الخمس.","تشغيل ومعايرة البوابات الأمنية وأجهزة الكشف اليدوية عن المعادن.","تفسير وتحليل دلالات ألوان صور أجهزة كشف الحقائب بالأشعة السينية لكشف المخاطر المخبأة."]}
};
const slug=new URLSearchParams(location.search).get('course')||'vehicle-search-security-inspection';const d=courses[slug]||courses['vehicle-search-security-inspection'];
function render(){const modules=d.modules.map((m,i)=>`<div class="module"><b>MODULE ${String(i+1).padStart(2,'0')}</b><span class="en">${m[0]}</span><span class="ar">${m[1]}</span></div>`).join('');const en=d.objectivesEn.map(x=>`<li>${x}</li>`).join('');const ar=d.objectivesAr.map(x=>`<li>${x}</li>`).join('');document.getElementById('course').innerHTML=`<section class="course-hero"><div><img class="course-image" src="${d.image}" alt="${d.en}"></div><div><div class="eyebrow">SECURITY INSTRUCTOR • AVAILABLE COURSE</div><h1 class="title-en">${d.en}</h1><div class="title-ar">${d.ar}</div><div class="status">AVAILABLE / متاحة الآن</div><p class="intro">${d.introEn}</p><p class="intro ar">${d.introAr}</p></div></section><section class="section-block"><h2 class="section-title">Learning Objectives <small>أهداف الدورة</small></h2><div class="objectives-grid"><div class="panel"><h3>English</h3><ul>${en}</ul></div><div class="panel ar"><h3>العربية</h3><ul>${ar}</ul></div></div></section><section class="section-block"><h2 class="section-title">Course Modules <small>وحدات الدورة</small></h2><div class="modules">${modules}</div></section><section class="section-block"><h2 class="section-title">Practical Training <small>التدريب العملي</small></h2><div class="practical"><p><strong>Learn → Practice → Demonstrate → Apply</strong></p><p>Training connects professional knowledge with practical exercises, realistic scenarios and hands-on application.</p><p class="ar">يربط التدريب بين المعرفة المهنية والتمارين العملية والسيناريوهات الواقعية والتطبيق المباشر.</p></div></section><div class="notice">Public Preview: Selected course information is available publicly. Full training materials are not publicly downloadable.</div><div class="notice ar">المعاينة العامة: تتوفر معلومات مختارة عن الدورة للعامة، ولا تتاح المواد التدريبية الكاملة للتنزيل العام.</div><section class="stats"><div class="stats-head"><div><h2>Course Statistics <small>إحصائيات الدورة</small></h2><p class="stats-sub">Live course activity and learner ratings / نشاط الدورة وتقييمات المتدربين</p></div></div><div class="stats-grid"><div class="stat"><div class="label-en">Views</div><div class="value" id="views">—</div><div class="label-ar">المشاهدات</div></div><div class="stat"><div class="label-en">Course Entries</div><div class="value" id="entries">—</div><div class="label-ar">مرات الدخول</div></div><div class="stat"><div class="label-en">Positive Ratings</div><div class="value" id="positive">—</div><div class="label-ar">التقييمات الإيجابية</div></div><div class="stat"><div class="label-en">Average Rating</div><div class="value" id="average">—</div><div class="label-ar">متوسط التقييم</div></div><div class="stat"><div class="label-en">Rating Count</div><div class="value" id="count">—</div><div class="label-ar">عدد التقييمات</div></div></div><div class="rating-box"><div class="rating-title">Rate this course / قيّم هذه الدورة</div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="star-btn" type="button" data-rate="${n}">★ ${n}</button>`).join('')}</div><div class="rating-msg" id="ratingMsg">Select a rating / اختر تقييمًا</div></div></section><div class="footer-actions"><a class="action primary" href="course-assessment-v2.html?course=${encodeURIComponent(slug)}">Initial Course Assessment / التقييم المبدئي للدورة</a><a class="action secondary" href="index.html#courses">Back to Courses / العودة للدورات</a></div>`}
async function loadStats(){try{const r=await fetch(`${API}/api/course-stats/${encodeURIComponent(slug)}`);if(!r.ok)throw 0;const s=await r.json();document.getElementById('views').textContent=s.views??0;document.getElementById('entries').textContent=s.entries??0;document.getElementById('positive').textContent=s.positiveRatings??0;document.getElementById('average').textContent=s.averageRating??'0.0';document.getElementById('count').textContent=s.ratingCount??0}catch(e){document.getElementById('ratingMsg').textContent='Statistics service unavailable / خدمة الإحصائيات غير متاحة حاليًا'}}
async function entry(){try{await fetch(`${API}/api/course-stats/${encodeURIComponent(slug)}/entry`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){}}
async function rate(n){try{const r=await fetch(`${API}/api/course-stats/${encodeURIComponent(slug)}/rating`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating:n})});if(!r.ok)throw 0;document.getElementById('ratingMsg').textContent='Thank you for your rating. / شكرًا لتقييمك.';loadStats()}catch(e){document.getElementById('ratingMsg').textContent='Rating service unavailable / خدمة التقييم غير متاحة حاليًا'}}
render();document.querySelectorAll('[data-rate]').forEach(b=>b.addEventListener('click',()=>rate(Number(b.dataset.rate))));entry().finally(loadStats);
</script></body></html>
