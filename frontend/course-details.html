:root{--navy:#0B1F33;--navy2:#102A43;--card:#0d2439;--gold:#c8a96b;--white:#fff;--muted:#cbd5df;--line:#294158}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--navy);color:var(--white);font-family:Arial,Helvetica,sans-serif}.details-wrap{max-width:1180px;margin:auto;padding:30px 5% 70px}.details-top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:34px}.back-link{color:#fff;text-decoration:none;border:1px solid #718191;padding:10px 15px}.course-hero{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.05fr);gap:38px;align-items:center}.course-image{width:100%;height:430px;object-fit:cover;border:1px solid var(--gold);padding:6px;background:var(--navy2)}.eyebrow{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.1em}.title-en{font-size:clamp(32px,4vw,56px);line-height:1.02;margin:12px 0;color:#fff}.title-ar{font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:clamp(25px,3vw,38px);font-weight:800;line-height:1.35;color:#fff;margin:12px 0}.status{display:inline-block;margin-top:10px;border:1px solid var(--gold);padding:8px 13px;color:var(--gold);font-weight:800}.intro{font-size:17px;line-height:1.8;color:#dbe2e8;margin-top:20px}.intro.ar{direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.section-block{margin-top:48px}.section-title{font-size:29px;margin:0 0 22px;color:#fff}.section-title small{display:block;color:#fff;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:22px;margin-top:6px;opacity:.95}.objectives-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--navy2);border:1px solid var(--line);padding:25px;color:#fff}.panel h3{margin:0 0 18px;color:var(--gold);font-size:17px}.panel.ar{direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.panel ul{margin:0;padding-left:24px}.panel.ar ul{padding-left:0;padding-right:24px}.panel li{margin:0 0 15px;line-height:1.65;color:#fff;font-size:16px}.modules{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.module{background:var(--card);border:1px solid var(--line);padding:18px 14px;min-height:210px;color:#fff}.module b{display:block;color:var(--gold);font-size:13px;margin-bottom:12px}.module .en{display:block;color:#fff;line-height:1.55;font-size:15px}.module .ar{display:block;margin-top:13px;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;color:#fff;line-height:1.65;font-size:15px}.practical{border:1px solid var(--gold);background:linear-gradient(135deg,#102A43,#132f49);padding:25px}.practical h3{margin:0 0 12px;color:var(--gold)}.practical p{color:#fff;line-height:1.8;margin:7px 0}.practical .ar{direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.stats{margin-top:44px;border:1px solid var(--line);background:#102A43;padding:25px}.stats-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:20px}.stats h2{margin:0;color:#fff;font-size:28px}.stats h2 small{display:block;margin-top:5px;color:#fff;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:21px}.stats-sub{color:#cbd5df;margin:0}.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#0d2439;border:1px solid var(--line);padding:17px 10px;text-align:center}.stat .label-en{color:var(--gold);font-size:12px;font-weight:800}.stat .value{font-size:27px;font-weight:900;color:#fff;margin:6px 0}.stat .label-ar{color:#fff;font-size:13px;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl}.rating-box{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}.rating-title{color:var(--gold);font-weight:800}.stars{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.star-btn{border:1px solid var(--gold);background:transparent;color:var(--gold);padding:9px 14px;cursor:pointer;font-weight:800}.star-btn:hover{background:var(--gold);color:#101820}.rating-msg{margin-top:10px;color:#cbd5df;font-size:14px;min-height:18px}.footer-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}.action{display:inline-block;text-decoration:none;padding:13px 20px;font-weight:800;border:1px solid var(--gold)}.primary{background:var(--gold);color:#101820}.secondary{color:#fff;background:transparent}
@media(max-width:900px){.course-hero,.objectives-grid{grid-template-columns:1fr}.modules{grid-template-columns:repeat(2,1fr)}.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.modules,.stats-grid{grid-template-columns:1fr}.details-top{align-items:flex-start;flex-direction:column}.course-image{height:300px}.stats-head{display:block}.stats-sub{margin-top:10px}}

</head>
<body>
<div class="details-wrap">
<header class="details-top"><strong>SI &nbsp; SECURITY INSTRUCTOR</strong><a class="back-link" href="index.html#courses">← Back to Courses / العودة للدورات</a></header>
<main id="course"></main>
</div>
<script>
const API='https://security-instructor.onrender.com';
const data={
 'traffic-management-vehicle-control':{en:'TRAFFIC MANAGEMENT & VEHICLE CONTROL',ar:'إدارة حركة المرور والتحكم في المركبات في الموقع',image:'assets/courses/04_Vehicle_Search_Security_Inspection.jpg',modules:[['01','Fundamentals of Traffic Control & Roadway Positions','أساسيات التحكم في حركة المرور ومواقع الوقوف على الطرق'],['02','Standard Hand Signals & Whistle Code Commands','الإشارات اليدوية القياسية وأوامر الصافرة'],['03','Traffic Responsibilities, Gate Duty, & Safety Equipment','مسؤوليات تنظيم المرور ومهام البوابات ومعدات السلامة'],['04','Site Traffic Plans, Separation, & Inductions','خطط حركة المرور بالموقع والفصل والتعريف بإجراءات السلامة'],['05','Parking Management Technologies & Traffic Calming','تقنيات إدارة المواقف وتهدئة حركة المرور']],objectives:{en:['Understand the importance of professional site traffic management.','Identify various categories of vehicular and pedestrian traffic.','Master the 6 basic traffic hand signals and whistle codes.','Enforce strict parking rules and deploy parking lot technologies.','Apply traffic calming measures to reduce vehicle speed and accidents.'],ar:['فهم الأهمية البالغة لإدارة وتنظيم حركة المرور في مواقع العمل الحيوية.','تحديد وفصل الفئات المختلفة لحركة المركبات والمشاة لحفظ السلامة.','إتقان الحركات والإشارات الست الأساسية لتوجيه المرور يدويًا وإشارات الصافرة.','تطبيق قواعد المواقف الصارمة وتوظيف تقنيات إدارة المواقف الحديثة.','تطبيق تدابير تهدئة حركة المرور الهندسية لخفض السرعات والحد من الحوادث.']},intro:{en:'A practical course focused on professional site traffic management, vehicle and pedestrian control, standardized hand signals, whistle commands, parking management and traffic calming.',ar:'دورة عملية تركز على الإدارة المهنية لحركة المرور في مواقع العمل، وتنظيم حركة المركبات والمشاة، والإشارات اليدوية القياسية، وأوامر الصافرة، وإدارة المواقف وتهدئة حركة المرور.'}},
 'crowd-management-event-security':{en:'CROWD MANAGEMENT & EVENT SECURITY',ar:'إدارة الحشود وتأمين الفعاليات والمناسبات الكبرى',image:'assets/courses/02_Crowd_Management_Event_Security.jpg',modules:[['01','Crowd Dynamics & Group Psychology','ديناميكيات الحشود وعلم نفس الجماهير'],['02','Crowd Categories & Behaviour Analysis','فئات الحشود وتحليل السلوك'],['03','Countermeasures for Hostile & Unruly Crowds','التدابير المضادة للحشود المشاغبة والعدائية'],['04','Crowd Control Formations for Events','تشكيلات السيطرة على الحشود في الفعاليات'],['05','Access Control & Screening Policies','سياسات تنظيم الدخول والتفتيش']],objectives:{en:['Understand the basic concepts of crowd dynamics and group psychology.','Analyze different categories of crowds and expect their behaviors.','Apply 8 scientific countermeasures to control hostile and unruly crowds.','Deploy basic riot and crowd control formations in special events.','Implement strict access control and screening policies in Gulf environments.'],ar:['فهم المفاهيم الأساسية لديناميكيات الحشود وعلم نفس الجماهير.','تحليل الفئات المختلفة للحشود وتوقع مسارات سلوكياتها بدقة.','تطبيق 8 تدابير مضادة علمية للسيطرة على الحشود المشاغبة والعدائية.','نشر وتشكيل قوات مكافحة الشغب والسيطرة على الحشود في الفعاليات.','تطبيق سياسات صارمة لتنظيم الدخول والتفتيش تلائم بيئة الخليج العربي.']},intro:{en:'A practical course covering crowd dynamics, behaviour analysis, control measures, event formations, access control and screening in Gulf environments.',ar:'دورة عملية تتناول ديناميكيات الحشود، وتحليل السلوك، وتدابير السيطرة، والتشكيلات الأمنية للفعاليات، وتنظيم الدخول والتفتيش في بيئات الخليج العربي.'}},
 'fire-safety-emergency-response':{en:'FIRE SAFETY & EMERGENCY RESPONSE',ar:'السلامة من الحرائق وتدابير الاستجابة للطوارئ',image:'assets/courses/03_Fire_Safety_Emergency_Response.jpg',modules:[['01','Fundamentals of Fire Science & Building Hazards','أساسيات علم الحرائق ومخاطر المباني'],['02','Fire Classifications & Portable Extinguishing Agents','تصنيفات الحرائق ووسائط الإطفاء المحمولة'],['03','Fire Detection, Alarms & Suppression Systems','أنظمة الكشف والإنذار والإطفاء'],['04','Tactical Response & Facility Fire Plans','الاستجابة التكتيكية وخطط مكافحة الحرائق بالمنشآت'],['05','Emergency Evacuation & Incident Command','الإخلاء في حالات الطوارئ وقيادة الحوادث']],objectives:{en:['Master the core physics and chemistry of fire tetrahedron dynamics.','Identify fire classifications and select portable agents per NFPA 10.','Demonstrate proper response and validation of fire alarm systems.','Apply tactical countermeasures including RACE, arson prevention, and security.','Manage mass evacuations and incident command structures per NFPA 101.'],ar:['إتقان المفاهيم الأساسية لكيمياء الحريق وديناميكيات رباعي الأوجه.','تصنيف أنواع الحرائق واختيار وسائط الإطفاء المناسبة بموجب NFPA 10.','تطبيق الاستجابة الصحيحة وتأكيد تنبيهات لوحات الكشف والإنذار.','تنفيذ تدابير الوقاية مثل RACE، ومكافحة الافتعال المتعمد، وتأمين المنشأة.','قيادة عمليات الإخلاء الجماعي وإدارة الحوادث بموجب معايير NFPA 101.']},intro:{en:'A practical fire-safety course covering fire science, classifications, extinguishing agents, detection and alarm systems, tactical response, evacuation and incident command.',ar:'دورة عملية في السلامة من الحرائق تتناول علم الحرائق وتصنيفاتها ووسائط الإطفاء وأنظمة الكشف والإنذار والاستجابة التكتيكية والإخلاء وقيادة الحوادث.'}},
 'vehicle-search-security-inspection':{en:'VEHICLE SEARCH & SECURITY INSPECTION',ar:'تفتيش المركبات والتفتيش الأمني',image:'assets/courses/01_Traffic_Management_Vehicle_Control.jpg',modules:[['01','Legal Framework, Authority & Consent Principles','الإطار القانوني والصلاحيات ومبادئ الموافقة'],['02','Checkpoint & Search Bay Architectural Design','التصميم الهندسي لمنصات التفتيش وممرات البوابات'],['03','Modern Search Tools, Technologies & Canines','أدوات التفتيش الحديثة والتقنيات وفرق K9'],['04','10-Point Systematic Vehicle Search Sequence','المنهجية العشرية لتفتيش المركبات'],['05','Practical Exercises, Quizzes & Incident Response','التمارين التطبيقية والتقييم والاستجابة للحوادث']],objectives:{en:['Apply the 10-point vehicle search sequence systematically and securely.','Evaluate vehicle search legal limits and understand consent principles.','Manage driver search refusals calmly without initiating physical conflict.','Deploy advanced contraband and explosive trace detection technologies.','Design and optimize an access control search bay for traffic flow.'],ar:['تطبيق المنهجية العشرية المنظمة لتفتيش المركبات بشكل آمن ومحترف.','تقييم الحدود القانونية لتفتيش المركبات وفهم مبدأ الموافقة والامتناع.','إدارة حالات امتناع السائقين عن التفتيش بهدوء وحزم وبدون احتكاك مادي.','تشغيل تقنيات كشف الممنوعات المتقدمة وكشف أثر المتفجرات ميدانيًا.','التصميم والتحكم الهندسي بمسارات منصة تفتيش المركبات وتنظيم المرور.']},intro:{en:'A professional practical course covering vehicle search procedures, access-control search bays, inspection technologies, systematic search sequences and incident response.',ar:'دورة عملية مهنية تغطي إجراءات تفتيش المركبات، ومنصات التفتيش والتحكم بالدخول، وتقنيات التفتيش، والمنهجيات المنظمة للتفتيش والاستجابة للحوادث.'}},
 'person-search-security-screening':{en:'PERSON SEARCH & SECURITY SCREENING',ar:'تفتيش الأشخاص وإجراءات التفتيش الأمني',image:'assets/courses/05_Person_Search_Security_Screening.jpg',modules:[['01','Search Regulations, Legal Boundaries & Consent','أنظمة التفتيش والحدود القانونية ومبادئ الموافقة'],['02','Security Checkpoint & 5-Zone Screening Point Layout','التصميم الهندسي لنقاط التفتيش ونظام المناطق الخمس'],['03','Security Screening Technologies & Tool Operation','تقنيات التفتيش الأمني وتشغيل الأدوات والمعدات'],['04','8-Zone Physical Body Search & Baggage Inspection','التفتيش الجسدي بنظام المناطق الثماني وتفتيش الحقائب'],['05','Prohibited Items Processing & Evidence Handling Procedures','إجراءات التعامل مع الممنوعات وحفظ الأدلة']],objectives:{en:['Apply the 8-zone physical body search technique methodically and professionally.','Understand legal boundaries of person searches and female search protocols.','Design and manage a 5-zone security screening point layout.','Operate walkthrough (WTMD) and handheld (HHMD) metal detectors correctly.','Interpret baggage X-ray scanner color images to detect hidden contraband.'],ar:['تطبيق المنهجية الثمانية للتفتيش الجسدي المنظم بطريقة مهنية محترفة.','فهم الجوانب القانونية الحاكمة لتفتيش الأفراد وبروتوكولات تفتيش النساء.','هندسة وإدارة نقاط التفتيش الأمني الميدانية باستخدام نظام المناطق الخمس.','تشغيل ومعايرة البوابات الأمنية وأجهزة الكشف اليدوية عن المعادن.','تفسير وتحليل دلالات ألوان صور أجهزة كشف الحقائب بالأشعة السينية لكشف المخاطر.']},intro:{en:'A professional practical course covering person-search procedures, security screening technologies, checkpoint design, physical search methods and prohibited-item handling.',ar:'دورة عملية مهنية تغطي إجراءات تفتيش الأشخاص، وتقنيات الفحص الأمني، وتصميم نقاط التفتيش، ومنهجيات التفتيش الجسدي والتعامل مع الممنوعات.'}}
};
const slug=new URLSearchParams(location.search).get('course')||'vehicle-search-security-inspection';
const c=data[slug]||data['vehicle-search-security-inspection'];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const assessment='course-assessment-v2.html?course='+encodeURIComponent(slug);
const el=document.getElementById('course');
el.innerHTML=`
<section class="course-hero">
  <img class="course-image" src="${c.image}" alt="${esc(c.en)}">
  <div><div class="eyebrow">SECURITY INSTRUCTOR • AVAILABLE COURSE</div><h1 class="title-en">${esc(c.en)}</h1><h2 class="title-ar">${esc(c.ar)}</h2><span class="status">AVAILABLE / متاحة</span><p class="intro">${esc(c.intro.en)}</p><p class="intro ar">${esc(c.intro.ar)}</p></div>
</section>
<section class="section-block"><h2 class="section-title">Learning Objectives <small>أهداف الدورة</small></h2><div class="objectives-grid"><div class="panel"><h3>English</h3><ul>${c.objectives.en.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="panel ar"><h3>العربية</h3><ul>${c.objectives.ar.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></section>
<section class="section-block"><h2 class="section-title">Course Modules <small>وحدات الدورة</small></h2><div class="modules">${c.modules.map(m=>`<article class="module"><b>MODULE ${m[0]}</b><span class="en">${esc(m[1])}</span><span class="ar">${esc(m[2])}</span></article>`).join('')}</div></section>
<section class="section-block"><h2 class="section-title">Practical Training <small>التدريب العملي</small></h2><div class="practical"><h3>Learn → Practice → Demonstrate → Apply</h3><p>Training connects professional knowledge with practical exercises, realistic scenarios and hands-on application.</p><p class="ar">يربط التدريب بين المعرفة المهنية والتمارين العملية والسيناريوهات الواقعية والتطبيق المباشر.</p></div></section>
<section class="stats" id="courseStats"><div class="stats-head"><div><h2>Course Statistics <small>إحصائيات الدورة</small></h2><p class="stats-sub">Live course activity and learner ratings / نشاط الدورة وتقييمات المتدربين</p></div></div><div class="stats-grid" id="statsGrid"></div><div class="rating-box"><div class="rating-title">Rate this course / قيّم هذه الدورة</div><div class="stars" id="stars"></div><div class="rating-msg" id="ratingMsg"></div></div></section>
<div class="footer-actions"><a class="action primary" href="${assessment}">Initial Course Assessment / التقييم المبدئي للدورة</a><a class="action secondary" href="index.html#courses">Back to Courses / العودة للدورات</a></div>`;
const labels=[['Views','المشاهدات','views'],['Course Entries','مرات الدخول','entries'],['Positive Ratings','التقييمات الإيجابية','positiveRatings'],['Average Rating','متوسط التقييم','averageRating'],['Rating Count','عدد التقييمات','ratingCount']];
const grid=document.getElementById('statsGrid');
labels.forEach(x=>{grid.insertAdjacentHTML('beforeend',`<div class="stat"><div class="label-en">${x[0]}</div><div class="value" data-key="${x[2]}">—</div><div class="label-ar">${x[1]}</div></div>`)});
function setStats(s){labels.forEach(x=>{const n=document.querySelector(`[data-key="${x[2]}"]`);let v=s&&s[x[2]];if(x[2]==='averageRating'&&typeof v==='number')v=v.toFixed(1);n.textContent=(v===undefined||v===null)?'—':v})}
function loadStats(){fetch(API+'/api/course-stats/'+encodeURIComponent(slug),{credentials:'omit'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(setStats).catch(()=>document.getElementById('ratingMsg').textContent='Statistics service is temporarily unavailable. / خدمة الإحصائيات غير متاحة مؤقتًا.')}
function recordEntry(){fetch(API+'/api/course-stats/'+encodeURIComponent(slug)+'/entry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'entry'})}).then(r=>r.ok?r.json():Promise.reject()).then(setStats).catch(()=>{})}
const stars=document.getElementById('stars');
for(let i=1;i<=5;i++){const b=document.createElement('button');b.className='star-btn';b.type='button';b.textContent='★ '+i;b.onclick=()=>{b.disabled=true;fetch(API+'/api/course-stats/'+encodeURIComponent(slug)+'/rating',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating:i})}).then(r=>r.ok?r.json():Promise.reject()).then(s=>{setStats(s);document.getElementById('ratingMsg').textContent='Thank you for your rating. / شكرًا لتقييمك.'}).catch(()=>{document.getElementById('ratingMsg').textContent='Unable to save the rating right now. / تعذر حفظ التقييم حاليًا.'}).finally(()=>b.disabled=false)};stars.appendChild(b)}
loadStats();recordEntry();
</script>
</body>
</html>
