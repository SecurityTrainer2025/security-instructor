body{background:var(--navy);color:var(--white)}.details-wrap{max-width:1180px;margin:auto;padding:34px 5% 70px}.details-top{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:28px}.back-link{color:#fff;text-decoration:none;border:1px solid #718191;padding:10px 15px}.course-hero{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.1fr);gap:36px;align-items:center}.course-image{width:100%;max-height:440px;object-fit:cover;border:1px solid var(--gold);padding:6px;background:var(--navy2)}.eyebrow{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.1em}.title-en{font-size:clamp(30px,4vw,50px);line-height:1.05;margin:10px 0}.title-ar{font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:clamp(24px,3vw,36px);font-weight:800;line-height:1.35;color:#e7edf2}.status{display:inline-block;margin-top:18px;border:1px solid var(--gold);padding:8px 13px;color:var(--gold);font-weight:800}.intro{font-size:17px;line-height:1.8;color:var(--muted);margin-top:20px}.intro.ar{direction:rtl;text-align:right}.section-block{margin-top:42px}.section-title{font-size:28px;margin:0 0 18px}.section-title small{display:block;color:#dbe2e8;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;font-size:22px;margin-top:5px}.objectives-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--navy2);border:1px solid var(--line);padding:24px}.panel h3{margin-top:0;color:var(--gold)}.panel.ar{direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.panel ul{margin:0;padding-left:22px}.panel.ar ul{padding-left:0;padding-right:22px}.panel li{margin:0 0 14px;line-height:1.6}.modules{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.module{background:#0d2439;border:1px solid var(--line);padding:18px 14px;min-height:145px}.module b{display:block;color:var(--gold);font-size:13px;margin-bottom:10px}.module span{display:block;line-height:1.5}.module .ar{margin-top:10px;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;text-align:right;color:#dbe2e8}.practical{border:1px solid var(--gold);background:linear-gradient(135deg,#102A43,#132f49);padding:24px}.practical p{color:#dbe2e8;line-height:1.8;margin:7px 0}.notice{margin-top:20px;border-left:3px solid var(--gold);padding:14px 18px;background:#102A43;color:#dbe2e8;line-height:1.7}.notice.ar{border-left:0;border-right:3px solid var(--gold);direction:rtl;text-align:right;font-family:Cairo,Tahoma,Arial,sans-serif}.footer-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}.action{display:inline-block;text-decoration:none;padding:13px 20px;font-weight:800;border:1px solid var(--gold)}.primary{background:var(--gold);color:#101820}.secondary{color:#fff;background:transparent}@media(max-width:850px){.course-hero,.objectives-grid{grid-template-columns:1fr}.modules{grid-template-columns:1fr 1fr}}@media(max-width:520px){.modules{grid-template-columns:1fr}.details-top{align-items:flex-start;flex-direction:column}}

<script>
const data={
 'traffic-management-vehicle-control':{en:'TRAFFIC MANAGEMENT & VEHICLE CONTROL',ar:'إدارة حركة المرور والتحكم في المركبات في الموقع',image:'assets/courses/04_Vehicle_Search_Security_Inspection.jpg',modules:[['01','Fundamentals of Traffic Control & Roadway Positions','أساسيات التحكم في حركة المرور ومواقع الوقوف على الطرق'],['02','Standard Hand Signals & Whistle Code Commands','الإشارات اليدوية القياسية وأوامر الصافرة'],['03','Traffic Responsibilities, Gate Duty, & Safety Equipment','مسؤوليات تنظيم المرور ومهام البوابات ومعدات السلامة'],['04','Site Traffic Plans, Separation, & Inductions','خطط حركة المرور بالموقع والفصل والتعريف بإجراءات السلامة'],['05','Parking Management Technologies & Traffic Calming','تقنيات إدارة المواقف وتهدئة حركة المرور']],objectives:{en:['Understand the importance of professional site traffic management.','Identify various categories of vehicular and pedestrian traffic.','Master the 6 basic traffic hand signals and whistle codes.','Enforce strict parking rules and deploy parking lot technologies.','Apply traffic calming measures to reduce vehicle speed and accidents.'],ar:['فهم الأهمية البالغة لإدارة وتنظيم حركة المرور في مواقع العمل الحيوية.','تحديد وفصل الفئات المختلفة لحركة المركبات والمشاة لحفظ السلامة.','إتقان الحركات والإشارات الست الأساسية لتوجيه المرور يدويًا وإشارات الصافرة.','تطبيق قواعد المواقف الصارمة وتوظيف تقنيات إدارة المواقف الحديثة.','تطبيق تدابير تهدئة حركة المرور الهندسية لخفض السرعات والحد من الحوادث.']},intro:{en:'A practical course focused on professional site traffic management, vehicle and pedestrian control, standardized hand signals, whistle commands, parking management and traffic calming.',ar:'دورة عملية تركز على الإدارة المهنية لحركة المرور في مواقع العمل، وتنظيم حركة المركبات والمشاة، والإشارات اليدوية القياسية، وأوامر الصافرة، وإدارة المواقف وتهدئة حركة المرور.'}},
 'crowd-management-event-security':{en:'CROWD MANAGEMENT & EVENT SECURITY',ar:'إدارة الحشود وتأمين الفعاليات والمناسبات الكبرى',image:'assets/courses/02_Crowd_Management_Event_Security.jpg',modules:[['01','Crowd Dynamics & Group Psychology','ديناميكيات الحشود وعلم نفس الجماهير'],['02','Crowd Categories & Behaviour Analysis','فئات الحشود وتحليل السلوك'],['03','Countermeasures for Hostile & Unruly Crowds','التدابير المضادة للحشود المشاغبة والعدائية'],['04','Crowd Control Formations for Events','تشكيلات السيطرة على الحشود في الفعاليات'],['05','Access Control & Screening Policies','سياسات تنظيم الدخول والتفتيش']],objectives:{en:['Understand the basic concepts of crowd dynamics and group psychology.','Analyze different categories of crowds and expect their behaviors.','Apply 8 scientific countermeasures to control hostile and unruly crowds.','Deploy basic riot and crowd control formations in special events.','Implement strict access control and screening policies in Gulf environments.'],ar:['فهم المفاهيم الأساسية لديناميكيات الحشود وعلم نفس الجماهير.','تحليل الفئات المختلفة للحشود وتوقع مسارات سلوكياتها بدقة.','تطبيق 8 تدابير مضادة علمية للسيطرة على الحشود المشاغبة والعدائية.','نشر وتشكيل قوات مكافحة الشغب والسيطرة على الحشود في الفعاليات.','تطبيق سياسات صارمة لتنظيم الدخول والتفتيش تلائم بيئة الخليج العربي.']},intro:{en:'A practical course covering crowd dynamics, behaviour analysis, control measures, event formations, access control and screening in Gulf environments.',ar:'دورة عملية تتناول ديناميكيات الحشود، وتحليل السلوك، وتدابير السيطرة، والتشكيلات الأمنية للفعاليات، وتنظيم الدخول والتفتيش في بيئات الخليج العربي.'}},
 'fire-safety-emergency-response':{en:'FIRE SAFETY & EMERGENCY RESPONSE',ar:'السلامة من الحرائق وتدابير الاستجابة للطوارئ',image:'assets/courses/03_Fire_Safety_Emergency_Response.jpg',modules:[['01','Fundamentals of Fire Science & Building Hazards','أساسيات علم الحرائق ومخاطر المباني'],['02','Fire Classifications & Portable Extinguishing Agents','تصنيفات الحرائق ووسائط الإطفاء المحمولة'],['03','Fire Detection, Alarms & Suppression Systems','أنظمة الكشف والإنذار والإطفاء'],['04','Tactical Response & Facility Fire Plans','الاستجابة التكتيكية وخطط مكافحة الحرائق بالمنشآت'],['05','Emergency Evacuation & Incident Command','الإخلاء في حالات الطوارئ وقيادة الحوادث']],objectives:{en:['Master the core physics and chemistry of fire tetrahedron dynamics.','Identify fire classifications and select portable agents per NFPA 10.','Demonstrate proper response and validation of fire alarm systems.','Apply tactical countermeasures including RACE, arson prevention, and security.','Manage mass evacuations and incident command structures per NFPA 101.'],ar:['إتقان المفاهيم الأساسية لكيمياء الحريق وديناميكيات رباعي الأوجه.','تصنيف أنواع الحرائق واختيار وسائط الإطفاء المناسبة بموجب NFPA 10.','تطبيق الاستجابة الصحيحة وتأكيد تنبيهات لوحات الكشف والإنذار.','تنفيذ تدابير الوقاية مثل RACE، ومكافحة الافتعال المتعمد، وتأمين المنشأة.','قيادة عمليات الإخلاء الجماعي وإدارة الحوادث بموجب معايير NFPA 101.']},intro:{en:'A practical fire-safety course covering fire science, classifications, extinguishing agents, detection and alarm systems, tactical response, evacuation and incident command.',ar:'دورة عملية في السلامة من الحرائق تتناول علم الحرائق وتصنيفاتها ووسائط الإطفاء وأنظمة الكشف والإنذار والاستجابة التكتيكية والإخلاء وقيادة الحوادث.'}},
 'vehicle-search-security-inspection':{en:'VEHICLE SEARCH & SECURITY INSPECTION',ar:'تفتيش المركبات والتفتيش الأمني',image:'assets/courses/01_Traffic_Management_Vehicle_Control.jpg',coming:true,objectives:{en:['Apply the 10-point vehicle search sequence systematically and securely.','Evaluate vehicle search legal limits and understand consent principles.','Manage driver search refusals calmly without initiating physical conflict.','Deploy advanced contraband and explosive trace detection technologies.','Design and optimize an access control search bay for traffic flow.'],ar:['تطبيق المنهجية العشرية المنظمة لتفتيش المركبات بشكل آمن ومحترف.','تقييم الحدود القانونية لتفتيش المركبات وفهم مبدأ الموافقة والامتناع.','إدارة حالات امتناع السائقين عن التفتيش بهدوء وحزم وبدون احتكاك مادي.','تشغيل تقنيات كشف الممنوعات المتقدمة وكشف أثر المتفجرات ميدانيًا.','التصميم والتحكم الهندسي بمسارات منصة تفتيش المركبات وتنظيم المرور.']}},
 'person-search-security-screening':{en:'PERSON SEARCH & SECURITY SCREENING',ar:'تفتيش الأشخاص وإجراءات التفتيش الأمني',image:'assets/courses/05_Person_Search_Security_Screening.jpg',coming:true,objectives:{en:['Apply the 8-zone physical body search technique methodically and professionally.','Understand legal boundaries of person searches and female search protocols.','Design and manage a 5-zone security screening point layout.','Operate walkthrough (WTMD) and handheld (HHMD) metal detectors correctly.','Interpret baggage X-ray scanner color images to detect hidden contraband.'],ar:['تطبيق المنهجية الثمانية للتفتيش الجسدي المنظم بطريقة مهنية محترفة.','فهم الجوانب القانونية الحاكمة لتفتيش الأفراد وبروتوكولات تفتيش النساء.','هندسة وإدارة نقاط التفتيش الأمني الميدانية باستخدام نظام المناطق الخمس.','تشغيل ومعايرة البوابات الأمنية وأجهزة الكشف اليدوية عن المعادن.','تفسير وتحليل دلالات ألوان صور أجهزة كشف الحقائب بالأشعة السينية كشفًا للمخاطر.']}}
};
const slug=new URLSearchParams(location.search).get('course')||'traffic-management-vehicle-control';const c=data[slug]||data['traffic-management-vehicle-control'];

const modules=c.modules?`<section class="section-block"><h2 class="section-title">Course Modules <small>وحدات الدورة</small></h2><div class="modules">${c.modules.map(m=>`<div class="module"><b>MODULE ${m[0]}</b><span>${m[1]}</span><span class="ar">${m[2]}</span></div>`).join('')}</div></section>`:'';
document.getElementById('course').innerHTML=`<section class="course-hero"><div><img class="course-image" src="${c.image}" alt="${c.en}"></div><div><div class="eyebrow">SECURITY INSTRUCTOR • COURSE DETAILS</div><h1 class="title-en">${c.en}</h1><div class="title-ar">${c.ar}</div><span class="status">${c.coming?'COMING SOON / قريباً':'AVAILABLE / متاحة'}</span>${c.intro?`<p class="intro">${c.intro.en}</p><p class="intro ar">${c.intro.ar}</p>`:''}</div></section><section class="section-block"><h2 class="section-title">Learning Objectives <small>أهداف الدورة</small></h2><div class="objectives-grid"><div class="panel"><h3>English</h3><ul>${list(c.objectives.en)}</ul></div><div class="panel ar"><h3>العربية</h3><ul>${list(c.objectives.ar)}</ul></div></div></section>${modules}${!c.coming?`<section class="section-block"><h2 class="section-title">Practical Training <small>التدريب العملي</small></h2><div class="practical"><p><strong>Learn → Practice → Demonstrate → Apply</strong></p><p>Training is designed to connect knowledge with practical exercises, realistic scenarios and professional application.</p><p class="ar">تم تصميم التدريب لربط المعرفة بالتمارين العملية والسيناريوهات الواقعية والتطبيق المهني.</p></div></section><div class="notice"><strong>Public Preview:</strong> Selected course information is available publicly. Full training materials are not publicly downloadable.<br><span class="ar">المعاينة العامة: تتوفر معلومات مختارة عن الدورة للعامة، ولا تتاح المواد التدريبية الكاملة للتنزيل العام.</span></div>`:`<div class="notice"><strong>Coming Soon:</strong> This course is currently being prepared and will be available soon.<br><span class="ar">قريبًا: هذه الدورة قيد الإعداد وستتوفر قريبًا.</span></div>`}<div class="footer-actions"><a class="action primary" href="index.html#courses">View All Courses / عرض جميع الدورات</a><a class="action secondary" href="challenge.html">Security Knowledge Challenge / تحدي المعلومات الأمنية</a></div>`;
</script>
