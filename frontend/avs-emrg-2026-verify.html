<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AVS Workshop Certificate Verification | SI</title>
<style>:root{--n:#0B1F33;--g:#C8A96B;--paper:#FAF8F3}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#081725,#102A43);font-family:Arial,Tahoma,sans-serif;color:#17202a}.wrap{max-width:820px;margin:28px auto;padding:16px}.card{background:var(--paper);border:4px solid var(--n);outline:1px solid var(--g);padding:clamp(20px,5vw,40px);text-align:center}.brand{font-weight:900;letter-spacing:.12em;color:var(--n)}.ey{margin-top:24px;color:#8a6c30;font-weight:800;letter-spacing:.08em}.state{padding:16px;margin:22px 0;background:white;border:1px solid var(--g);font-size:18px;font-weight:800}.valid{color:#166534}.invalid,.revoked{color:#991b1b}.course{margin:20px 0;padding:18px;background:var(--n);color:white;border:1px solid var(--g)}.meta{line-height:2;color:#52616d}.ar{direction:rtl;font-family:Tahoma,Arial,sans-serif}.back{display:inline-block;margin-top:20px;padding:10px 16px;background:var(--g);color:var(--n);text-decoration:none;font-weight:800}</style></head>
<body><main class="wrap"><section class="card"><div class="brand">SI | SECURITY INSTRUCTOR</div><div class="ey">AVS WORKSHOP CERTIFICATE VERIFICATION<br>التحقق من شهادة الورشة</div><div id="state" class="state">Checking certificate… / جارٍ التحقق من الشهادة...</div><div id="content"></div><a class="back" href="index.html">Back to platform / العودة للمنصة</a></section></main>
<script src="config.js"></script><script>
(async function(){const API=(window.APP_CONFIG&&window.APP_CONFIG.API_BASE||'https://security-instructor.onrender.com').replace(/\/$/,'');const id=new URLSearchParams(location.search).get('certificateId');const state=document.getElementById('state'),content=document.getElementById('content');const add=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;content.append(e);return e};try{if(!id)throw new Error('Certificate ID is required / رقم الشهادة مطلوب');const res=await fetch(API+'/api/avs-emrg-2026/certificate/verify/'+encodeURIComponent(id),{cache:'no-store'});const d=await res.json();if(!res.ok)throw new Error(d.message||'Certificate not found / لم يتم العثور على الشهادة');state.className='state '+(d.valid?'valid':'revoked');state.textContent=d.valid?'VALID CERTIFICATE / شهادة صالحة':'REVOKED CERTIFICATE / شهادة ملغاة';add('h2',d.workshopTitleEn||'AVS-EMRG-2026');add('h3',d.workshopTitleAr||'','ar');const meta=add('div','');meta.className='meta';[['Learner / المتدرب',d.learnerName],['Certificate ID / رقم الشهادة',d.certificateId],['Workshop code / رمز الورشة',d.workshopCode],['Duration / المدة',String(d.durationHours)+' hours / ساعات'],['Issue date / تاريخ الإصدار',new Date(d.issuedAt).toLocaleDateString('en-GB')]].forEach(([k,v])=>{const row=document.createElement('p');const b=document.createElement('strong');b.textContent=k+': ';row.append(b,document.createTextNode(v||'—'));meta.append(row)});add('p',d.valid?'This record was checked against the SECURITY INSTRUCTOR workshop certificate database. / تم التحقق من السجل عبر قاعدة بيانات شهادات الورشة.':'This certificate record is revoked. / سجل هذه الشهادة ملغى.')}catch(e){state.className='state invalid';state.textContent='UNVERIFIED / تعذر التحقق';add('p',e.message)}})();
</script></body></html>
