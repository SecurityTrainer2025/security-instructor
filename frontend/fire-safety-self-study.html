<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Fire Safety Self-Study | SECURITY INSTRUCTOR</title><style>
:root{--navy:#0B1F33;--navy2:#102A43;--gold:#C8A96B;--white:#fff;--muted:#D5DDE5;--line:#294158}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:#fff;font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0 16px}.brand{font-weight:900;letter-spacing:.08em}.brand span{color:var(--gold)}.timer{border:1px solid var(--gold);padding:9px 13px;color:var(--gold);font-weight:900}.layout{display:grid;grid-template-columns:280px 1fr;gap:18px;margin-top:18px}.side,.main-card{background:var(--navy2);border:1px solid var(--line)}.side{padding:18px}.side h3{margin-top:0;color:var(--gold)}.module{padding:11px 8px;border-bottom:1px solid #294158;color:#fff}.module small{display:block;color:#aebbc6;margin-top:4px}.module.done{border-left:3px solid var(--gold)}.main-card{padding:24px}.kicker{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.12em}.main-card h1{font-size:32px;margin:8px 0}.ar{direction:rtl;text-align:right;font-family:Tahoma,Arial,sans-serif}.body{font-size:17px;line-height:1.8;color:#E4E9ED;margin:18px 0}.video{border:1px dashed #627386;padding:35px;text-align:center;color:#B8C3CC;margin:18px 0;background:#0B1F33}.quiz{border-top:1px solid var(--line);margin-top:22px;padding-top:20px}.q{margin:0 0 18px;padding:14px;background:#0B1F33;border:1px solid #294158}.q strong{display:block;margin-bottom:10px}.opt{display:block;padding:8px;color:#DDE5EB}.opt input{margin-right:8px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.btn{border:1px solid var(--gold);background:var(--gold);color:#101820;padding:12px 18px;font-weight:900;cursor:pointer}.btn.secondary{background:transparent;color:var(--gold)}.btn:disabled{opacity:.45;cursor:not-allowed}.result{margin-top:16px;padding:14px;border:1px solid var(--gold);display:none;line-height:1.6}.progress{height:8px;background:#0B1F33;border:1px solid #294158;margin:14px 0}.progress>span{display:block;height:100%;background:var(--gold);width:0}.notice{padding:14px;border:1px solid #b96b6b;background:#241a1a;color:#f2d7d7;margin:18px 0}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{order:2}.main-card{order:1}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">SECURITY <span>INSTRUCTOR</span><div style="font-size:11px;color:#9daab5;margin-top:4px">FIRE SAFETY SELF-STUDY</div></div><div class="timer" id="timer">ACCESS: --:--:--</div></header><div id="notice" class="notice" style="display:none"></div><div class="layout"><aside class="side"><h3>COURSE PROGRESS</h3><div class="progress"><span id="bar"></span></div><div id="summary">Loading…</div><div id="modules"></div></aside><main class="main-card"><div id="content">Loading course…</div></main></div></div><script>
const API='https://security-instructor.onrender.com';let session=sessionStorage.getItem('siSelfStudySession')||'';let accessExpires='';let screens=[];let index=0;let me=null;
const fallbackScreens=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+session,'Content-Type':'application/json'};const r=await fetch(API+path,opt);const d=await r.json();if(!r.ok)throw new Error(d.message||'Request failed');return d}
async function boot(){
 try{
  if(!session){const token=location.hash.match(/token=([^&]+)/)?.[1];if(!token){document.getElementById('content').innerHTML='<h1>Secure access required</h1><p>Please use the access link sent to your email. / يرجى استخدام رابط الدخول المرسل إلى بريدك الإلكتروني.</p>';return}const x=await fetch(API+'/api/self-study/session/exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:decodeURIComponent(token)})});const d=await x.json();if(!x.ok)throw new Error(d.message||'Access link expired');session=d.sessionToken;sessionStorage.setItem('siSelfStudySession',session);history.replaceState({},document.title,location.pathname);location.hash='';}
  me=await api('/api/self-study/me');accessExpires=me.accessExpiresAt;
  const courseScreens=await api('/api/self-study/courses/fire-safety-emergency-response/screens').catch(()=>null);
  if(courseScreens?.screens?.length)screens=courseScreens.screens.map(x=>x.id);else screens=[...fallbackScreens];
  if(!screens.length)throw new Error('No learning screens are currently published.');
  index=Number(sessionStorage.getItem('siSelfStudyIndex')||0);index=Math.min(Math.max(index,0),screens.length-1);renderModules();renderScreen();
 }catch(e){document.getElementById('content').innerHTML='<h1>Access unavailable</h1><p>'+esc(e.message)+'</p>'}
}
function renderModules(){document.getElementById('modules').innerHTML=['m1','m2','m3','m4','m5'].map((id,i)=>{const done=(me.progress?.modules?.[id]||0)>=80;return '<div class="module '+(done?'done':'')+'"><b>Module '+(i+1)+'</b><small>'+({m1:'Fire Science',m2:'Fire Classification',m3:'Detection & Alarms',m4:'Tactical Response',m5:'Evacuation & Command'}[id])+'</small></div>'}).join('');updateSummary()}
function updateSummary(){const done=me.progress?.completedScreens?.length||0;const pct=Math.round(done/screens.length*100);document.getElementById('bar').style.width=pct+'%';document.getElementById('summary').innerHTML='<strong>'+pct+'%</strong> complete<br><span style="color:#aebbc6">Cumulative score: '+(me.cumulativeScore||0)+'%</span>'}
async function renderScreen(){
 const id=screens[index];const d=await api('/api/self-study/screens/'+id);dQuestionCount=d.questions.length;const score=me.progress?.screenScores?.[id];let q='';d.questions.forEach((x,i)=>{q+='<div class="q"><strong>'+(i+1)+'. '+esc(x.q)+'</strong>'+x.options.map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</div>'});
 document.getElementById('content').innerHTML='<div class="kicker">LEARNING SCREEN '+(index+1)+' / '+screens.length+(d.slide?' • SOURCE SLIDE '+d.slide:'')+'</div><h1>'+esc(d.titleEn)+'</h1><div class="ar" style="color:#C8A96B;font-size:22px">'+esc(d.titleAr)+'</div><div class="body">'+esc(d.bodyEn)+'</div><div class="body ar">'+esc(d.bodyAr)+'</div><div class="video">VIDEO SLOT<br><small>Official / licensed / SI-produced video will be placed here.</small></div>'+((d.questions&&d.questions.length)?'<section class="quiz"><h2>Knowledge Check / اختبار المعرفة</h2>'+q+'</section>':'<div class="notice" style="background:#132a3d;border-color:#627386;color:#DDE5EB">Review screen / شاشة مراجعة — read the content and continue.</div>')+'<div class="actions"><button class="btn secondary" id="prev" '+(index===0?'disabled':'')+'>← Previous</button><button class="btn" id="submit">'+((d.questions&&d.questions.length)?'Submit / إرسال':'Continue / متابعة')+'</button></div><div id="result" class="result"></div>';
 document.getElementById('prev').onclick=()=>{if(index>0){index--;sessionStorage.setItem('siSelfStudyIndex',index);renderScreen()}};
 document.getElementById('submit').onclick=submitScreen;
}
let dQuestionCount=3;
async function submitScreen(){
 if(!dQuestionCount){if(index<screens.length-1){index++;sessionStorage.setItem('siSelfStudyIndex',index);renderScreen()}else{showCompletion()}return}
 const answers=[];for(let i=0;i<dQuestionCount;i++){const x=document.querySelector('input[name="q'+i+'"]:checked');if(!x){showResult('Please answer all questions. / يرجى الإجابة عن جميع الأسئلة.');return}answers.push(Number(x.value))}
 try{const d=await api('/api/self-study/screens/'+screens[index]+'/assessment',{method:'POST',body:JSON.stringify({answers})});showResult('Score: <strong>'+d.score+'%</strong><br>'+ (d.passed?'Passed. You may continue. / ناجح، يمكنك المتابعة.':'You need 80% to continue. Try again. / تحتاج إلى 80% للمتابعة، حاول مرة أخرى.')+'<br>Cumulative: '+d.cumulativeScore+'%');if(d.passed){me=await api('/api/self-study/me');renderModules();if(index<screens.length-1){index++;sessionStorage.setItem('siSelfStudyIndex',index);setTimeout(renderScreen,900)}else{setTimeout(showCompletion,900)}}}catch(e){showResult(esc(e.message))}
}
function showResult(html){const r=document.getElementById('result');r.innerHTML=html;r.style.display='block'}
async function showCompletion(){
 try{
  me=await api('/api/self-study/me');renderModules();
  if(me.finalPassed){showFinalResult({passed:true,score:me.finalBestScore,certificateId:me.certificateId});return}
  const d=await api('/api/self-study/final-assessment');
  document.getElementById('content').innerHTML='<div class="kicker">LEARNING PHASE COMPLETE</div><h1>Final Assessment</h1><div class="body">You have completed the required learning screens. The final assessment has 30 questions. Pass mark: 70%. You have up to 3 total attempts (2 free retakes).</div><div class="body ar">لقد أكملت شاشات التعلم المطلوبة. يتكون الاختبار النهائي من 30 سؤالًا. درجة النجاح: 70٪. لديك 3 محاولات إجمالاً (محاولتان لإعادة الاختبار مجاناً).</div><div class="notice" style="background:#132a3d;border-color:#627386;color:#DDE5EB">Attempts remaining: <strong>'+d.attemptsRemaining+'</strong> / المحاولات المتبقية: <strong>'+d.attemptsRemaining+'</strong></div><div class="actions"><button class="btn" id="startFinal">Start Final Assessment / بدء الاختبار النهائي</button></div><div id="result" class="result"></div>';
  document.getElementById('startFinal').onclick=()=>renderFinalAssessment(d);
 }catch(e){document.getElementById('content').innerHTML='<div class="kicker">FINAL ASSESSMENT</div><h1>Unavailable</h1><div class="body">'+esc(e.message)+'</div>'}
}
function renderFinalAssessment(d){
 const qs=d.questions||[];let html='<div class="kicker">FINAL ASSESSMENT • 30 QUESTIONS</div><h1>Fire Safety & Emergency Response</h1><div class="body">Answer all 30 questions. Pass mark: 70%.</div><div class="body ar">أجب عن جميع الأسئلة الثلاثين. درجة النجاح: 70٪.</div><section class="quiz">';
 qs.forEach((x,i)=>{html+='<div class="q"><strong>'+x.number+'. '+esc(x.q)+'</strong>'+x.options.map((o,j)=>'<label class="opt"><input type="radio" name="finalq'+i+'" value="'+j+'"> '+esc(o)+'</label>').join('')+'</div>'});
 html+='</section><div class="actions"><button class="btn secondary" id="backLearning">← Back / رجوع</button><button class="btn" id="submitFinal">Submit Final Assessment / إرسال الاختبار النهائي</button></div><div id="result" class="result"></div>';
 document.getElementById('content').innerHTML=html;
 document.getElementById('backLearning').onclick=()=>showCompletion();
 document.getElementById('submitFinal').onclick=()=>submitFinalAssessment(qs.length);
}
async function submitFinalAssessment(total){
 const answers=[];for(let i=0;i<total;i++){const x=document.querySelector('input[name="finalq'+i+'"]:checked');if(!x){showResult('Please answer all questions. / يرجى الإجابة عن جميع الأسئلة.');return}answers.push(Number(x.value))}
 const btn=document.getElementById('submitFinal');if(btn)btn.disabled=true;
 try{
  const d=await api('/api/self-study/final-assessment',{method:'POST',body:JSON.stringify({answers})});
  me=await api('/api/self-study/me');renderModules();
  if(d.passed){showFinalResult(d)}else{
   showResult('Score: <strong>'+d.score+'%</strong><br>Not passed. You need 70% to pass. Attempts remaining: '+d.attemptsRemaining+'<br>النتيجة: <strong>'+d.score+'٪</strong> — لم تنجح. تحتاج إلى 70٪ للنجاح. المحاولات المتبقية: '+d.attemptsRemaining);
   if(d.attemptsRemaining>0){setTimeout(showCompletion,1200)}
  }
 }catch(e){showResult(esc(e.message));if(btn)btn.disabled=false}
}
function showFinalResult(d){
 const passed=!!d.passed||!!me?.finalPassed;
 const score=d.score??me?.finalBestScore??0;
 const cert=d.certificateId||me?.certificateId||'';
 const verify=cert?'https://securitytrainer2025.github.io/security-instructor/frontend/verify.html?type=certificate&id='+encodeURIComponent(cert):'';
 document.getElementById('content').innerHTML='<div class="kicker">FINAL ASSESSMENT RESULT</div><h1>'+ (passed?'Passed / ناجح':'Not Passed / لم تنجح') +'</h1><div class="body">Final score: <strong>'+score+'%</strong><br>درجة الاختبار النهائي: <strong>'+score+'٪</strong></div>'+ (passed?'<div class="notice" style="background:#132a3d;border-color:#C8A96B;color:#fff">Congratulations. You completed the Fire Safety self-study requirements. / تهانينا. لقد أكملت متطلبات الدراسة الذاتية لدورة السلامة من الحرائق.</div>'+(cert?'<p><strong>Certificate ID:</strong> '+esc(cert)+'</p><p><a class="btn" href="'+verify+'" target="_blank" rel="noopener">Verify Certificate / التحقق من الشهادة</a></p>':'<p class="body">Certificate issuance is being processed. / يتم تجهيز الشهادة.</p>'):'<div class="notice">The final assessment was not passed. / لم يتم اجتياز الاختبار النهائي.</div>');
}
function tick(){if(!accessExpires)return;const ms=new Date(accessExpires)-new Date();if(ms<=0){document.getElementById('timer').textContent='ACCESS EXPIRED';document.getElementById('notice').style.display='block';document.getElementById('notice').textContent='Your self-study access has expired. / انتهت مدة الوصول للدراسة الذاتية.';return}const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;document.getElementById('timer').textContent='ACCESS: '+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
setInterval(tick,1000);boot();
</script></body></html>
