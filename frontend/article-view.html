<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | SECURITY INSTRUCTOR</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bilingual.css"><script src="config.js"></script></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">SI</span><span>SECURITY <b>INSTRUCTOR</b></span></a><nav><a href="index.html#courses">Courses / الدورات</a><a href="articles.html">Articles / المقالات</a><a href="index.html#contact">Contact / تواصل</a></nav><div class="top-actions"><a class="admin-link" href="admin.html">Admin / المدير</a></div></header>
<main class="section" style="min-height:70vh"><div id="articleRoot"><div class="loading">Loading article…</div></div></main><footer>SECURITY INSTRUCTOR | Abdallah Abdelaziz Shalaby</footer>
<script>const API=(window.APP_CONFIG&&window.APP_CONFIG.API_BASE)||'https://security-instructor.onrender.com';const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const text=s=>esc(s).replace(/\r?\n/g,'<br><br>');const slug=new URLSearchParams(location.search).get('slug');if(!slug)document.getElementById('articleRoot').innerHTML='<div class="panel"><p>Article not found. / المقال غير موجود.</p></div>';else fetch(API+'/api/articles/'+encodeURIComponent(slug),{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message||'Article not found');document.title=d.titleEn+' | SECURITY INSTRUCTOR';document.getElementById('articleRoot').innerHTML=`<article class="panel" style="max-width:940px;margin:auto"><div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #294158;padding-bottom:22px"><img src="${esc(d.authorImage||'Abdallah_Abdelaziz_Portrait.jpg')}" alt="${esc(d.authorName)}" style="width:130px;height:130px;object-fit:cover;border-radius:50%;border:2px solid #c8a96b"><div><div style="color:#c8a96b;font-size:13px;font-weight:800;letter-spacing:.1em">${esc(d.category)}</div><h1 style="margin:8px 0">${esc(d.titleEn)}</h1><h2 dir="rtl" style="margin:0;color:#fff">${esc(d.titleAr)}</h2><div style="margin-top:10px;color:#cbd5df">${esc(d.authorName)} · ${esc(d.authorTitle)}</div></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:28px"><div><h3>English</h3><p style="line-height:2;color:#dce5eb">${text(d.contentEn)}</p></div><div dir="rtl"><h3>العربية</h3><p style="line-height:2;color:#dce5eb">${text(d.contentAr)}</p></div></div><div style="margin-top:30px;padding-top:18px;border-top:1px solid #294158"><a class="btn gold" href="articles.html">All Articles / جميع المقالات</a></div></article>`}).catch(e=>document.getElementById('articleRoot').innerHTML='<div class="panel"><p>'+esc(e.message)+'</p></div>');</script></body></html>
