<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | المقال | SECURITY INSTRUCTOR</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="bilingual.css"><link rel="stylesheet" href="bilingual-brand.css"><script src="config.js"></script><style id="article-reading-layout-share-fix">
body.article-reading-shell{min-height:100vh;background:#f1f4f7}
body.article-reading-shell main.article-reading-shell{width:100%;max-width:none;margin:0 auto;padding:22px clamp(14px,3vw,48px);box-sizing:border-box}
#articleRoot{width:100%;max-width:none;margin:0 auto}
.article-reading{width:100%;max-width:1500px;margin:0 auto;padding:clamp(20px,3vw,46px);box-sizing:border-box;background:#0B1F33;border:1px solid #294158;box-shadow:0 12px 36px rgba(0,0,0,.12)}
.article-reading-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.article-reading-title{line-height:1.2;margin:.35em 0}
.article-reading-title-ar{line-height:1.35;margin:.35em 0;text-align:right}
.article-reading-section-head{line-height:1.35;margin:24px 0 14px}
.article-reading-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,44px)}
.article-language{min-width:0}
.article-language p{line-height:1.72!important;margin:.55em 0 1em!important;overflow-wrap:anywhere}
.article-language.ar{text-align:right;direction:rtl}
.article-reading-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center;margin:28px 0 0}
.article-share-button{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border:1px solid #C8A96B;background:#C8A96B;color:#101820;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.article-share-button.secondary{background:transparent;color:#C8A96B}
@media(max-width:760px){body.article-reading-shell main.article-reading-shell{padding:10px}.article-reading{padding:20px 16px}.article-reading-head{grid-template-columns:1fr;text-align:center}.article-reading-columns{grid-template-columns:1fr;gap:14px}.article-language.ar{border-top:1px solid #294158;padding-top:16px}.article-reading-title-ar{text-align:center}.article-reading-actions>*{width:100%;box-sizing:border-box}}
</style></head><body class="article-reading-shell">
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">SI</span><span>SECURITY <b>INSTRUCTOR</b></span></a><nav><a href="index.html#courses">Courses / الدورات</a><a href="knowledge-hub.html">Knowledge Hub / مركز المعرفة</a><a href="experts.html">Experts / الخبراء</a><a href="index.html#contact">Contact / تواصل</a></nav><div class="top-actions"><a class="admin-link" href="admin.html">Admin / المدير</a></div></header>
<main class="section article-reading-shell"><div id="articleRoot"><div class="loading">Loading article… / جارٍ تحميل المقال…</div></div></main><footer>SECURITY INSTRUCTOR | Professional Security Training & Knowledge Platform</footer>
<script>
const API=(window.APP_CONFIG&&window.APP_CONFIG.API_BASE)||'https://security-instructor.onrender.com';
const esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));
const text=s=>esc(s).replace(/\r?\n{2,}/g,'<br><br>').replace(/\r?\n/g,'<br>');
const slug=new URLSearchParams(location.search).get('slug');
const staticArticle={category:'Professional Knowledge Exchange',categoryAr:'تبادل المعرفة المهنية',titleEn:"Let's Exchange Our Knowledge",titleAr:'هيا نتبادل معلوماتنا',authorEn:'SECURITY INSTRUCTOR Knowledge Community',authorAr:'مجتمع المعرفة في SECURITY INSTRUCTOR',authorTitleEn:'Professional Security & Training Community',authorTitleAr:'مجتمع مهني للأمن والتدريب',sections:[
['Why knowledge exchange matters','لماذا يهمنا تبادل المعرفة؟','Security, safety and training professionals rarely face exactly the same environment. Each workplace, team and challenge can reveal a different lesson. Sharing those lessons responsibly helps professionals learn faster and make better-informed decisions.','نادراً ما يواجه متخصصو الأمن والسلامة والتدريب البيئة نفسها تماماً. فكل موقع وفريق وتحدٍ قد يكشف درساً مختلفاً. إن مشاركة هذه الدروس بمسؤولية تساعد المتخصصين على التعلم بشكل أسرع واتخاذ قرارات أكثر وعيًا.'],
['What can we share?','ماذا يمكننا أن نتبادل؟','We can share practical methods, training ideas, lessons learned, assessment approaches, leadership experiences, safety observations and professional perspectives. The most useful contribution is often a simple explanation of what worked, what did not, and what another professional should consider.','يمكننا تبادل الأساليب العملية، وأفكار التدريب، والدروس المستفادة، وأساليب التقييم، وتجارب القيادة، وملاحظات السلامة، ووجهات النظر المهنية. وغالباً ما تكون المساهمة الأكثر فائدة هي شرح بسيط لما نجح، وما لم ينجح، وما ينبغي على المتخصص الآخر مراعاته.'],
['What should never be shared?','ما الذي لا ينبغي مشاركته؟','Knowledge exchange must protect people and organizations. Do not publish confidential client information, personal data, security-sensitive details, access credentials, proprietary procedures or operational information that could create a risk.','يجب أن يحمي تبادل المعرفة الأفراد والجهات. لا تنشر معلومات العملاء السرية، أو البيانات الشخصية، أو التفاصيل الأمنية الحساسة، أو بيانات الدخول، أو الإجراءات المملوكة، أو المعلومات التشغيلية التي قد تسبب خطراً.'],
['A professional invitation','دعوة مهنية','If you work in security, safety, emergency response, training, leadership or related fields, your experience may contain a lesson that can help someone else. Share it clearly, respectfully and without exposing confidential information. Let us build a stronger professional community by learning from one another.','إذا كنت تعمل في الأمن أو السلامة أو الاستجابة للطوارئ أو التدريب أو القيادة أو المجالات ذات الصلة، فقد تحمل خبرتك درساً يمكن أن يساعد شخصاً آخر. شاركه بوضوح واحترام ودون كشف معلومات سرية. لنبنِ مجتمعاً مهنياً أقوى من خلال التعلم من بعضنا البعض.']
]};
function render(d){document.title=(d.titleEn||staticArticle.titleEn)+' | '+(d.titleAr||staticArticle.titleAr)+' | SECURITY INSTRUCTOR';const sections=d.sections||[['Article','المقال',d.contentEn||'',d.contentAr||'']];document.getElementById('articleRoot').innerHTML=`<article class="article-reading"><header class="article-reading-head"><div class="article-reading-authorbox"><div class="article-reading-monogram">SI</div></div><div><div class="article-reading-category">${esc(d.category||'Professional Knowledge Exchange')} / ${esc(d.categoryAr||'تبادل المعرفة المهنية')}</div><h1 class="article-reading-title">${esc(d.titleEn||'Article')}</h1><h2 class="article-reading-title-ar" dir="rtl">${esc(d.titleAr||'المقال')}</h2><div class="article-reading-authorline">${esc(d.authorEn||d.authorName||'Expert Contributor')} / ${esc(d.authorAr||d.authorName||'مساهم متخصص')} · ${esc(d.authorTitleEn||d.authorTitle||'')} / ${esc(d.authorTitleAr||d.authorTitle||'')}</div></div></header><div class="article-reading-intro">${bi('Professional Knowledge Exchange','تبادل المعرفة المهنية')}</div><div class="article-reading-sections">${sections.map(s=>`<section class="article-reading-section"><div class="article-reading-section-head">${bi(s[0],s[1])}</div><div class="article-reading-columns"><div class="article-language"><h3>English</h3><p>${text(s[2])}</p></div><div class="article-language ar"><h3>العربية</h3><p>${text(s[3])}</p></div></div></section>`).join('')}</div><div class="article-reading-actions"><button type="button" class="article-share-button" id="shareArticleBtn">${bi('Share Article','مشاركة المقال')}</button><button type="button" class="article-share-button secondary" id="copyArticleLinkBtn">${bi('Copy Article Link','نسخ رابط المقال')}</button><a class="btn gold" href="knowledge-hub.html">${bi('Back to Knowledge Hub','العودة إلى مركز المعرفة')}</a><a class="btn outline" href="experts.html">${bi('Contribute Your Knowledge','ساهم بخبرتك')}</a></div></article>`;
const shareBtn=document.getElementById('shareArticleBtn');
const copyBtn=document.getElementById('copyArticleLinkBtn');
const shareData={title:(d.titleEn||'Article')+' | '+(d.titleAr||'المقال'),text:(d.titleEn||'')+' / '+(d.titleAr||''),url:location.href};
if(shareBtn)shareBtn.addEventListener('click',async()=>{try{if(navigator.share){await navigator.share(shareData)}else{await navigator.clipboard.writeText(location.href);shareBtn.textContent='Link copied / تم نسخ الرابط'}}catch(e){if(e&&e.name!=='AbortError')shareBtn.textContent='Copy the link below / انسخ الرابط من شريط العنوان'}});
if(copyBtn)copyBtn.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);copyBtn.textContent='Copied / تم النسخ'}catch(e){window.prompt('Copy article link / انسخ رابط المقال',location.href)}});
}
const bi=(en,ar)=>`<span class="bi"><span class="bi-en" dir="ltr">${esc(en)}</span><span class="bi-ar" dir="rtl">${esc(ar)}</span></span>`;
if(!slug){render(staticArticle)}else if(slug==='lets-exchange-knowledge'){render(staticArticle)}else fetch(API+'/api/articles/'+encodeURIComponent(slug),{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message||'Article not found');if(!String(d.contentEn||'').trim()||!String(d.contentAr||'').trim()||!String(d.titleEn||'').trim()||!String(d.titleAr||'').trim())throw new Error('Article translation is incomplete');render({category:d.category,categoryAr:d.category,titleEn:d.titleEn,titleAr:d.titleAr,authorName:d.authorName,authorTitle:d.authorTitle,sections:[['Article','المقال',d.contentEn,d.contentAr]]})}).catch(err=>{const message=err&&err.message==='Article translation is incomplete'?'This article is not available for public reading until both language versions are complete and reviewed. / هذا المقال غير متاح للقراءة العامة حتى يكتمل المحتوى باللغتين وتتم مراجعته.':(err&&err.message==='Article not found'?'This article could not be found. / لم يتم العثور على هذا المقال.':'A temporary technical problem prevented this article from loading. Please try again later. / حدثت مشكلة فنية مؤقتة منعت تحميل المقال. يرجى المحاولة لاحقًا.');document.getElementById('articleRoot').innerHTML='<div class="loading">'+esc(message)+'</div>'});
</script></body></html>
