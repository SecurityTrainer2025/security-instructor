<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article Moderation | SECURITY INSTRUCTOR</title><style>body{margin:0;background:#0B1F33;color:#eef3f7;font-family:Arial;padding:24px}.wrap{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #294158;padding-bottom:16px}.btn{padding:10px 14px;border:1px solid #c8a96b;background:#c8a96b;color:#101820;font-weight:800;cursor:pointer}.alt{background:transparent;color:#c8a96b}.panel{background:#102A43;border:1px solid #294158;padding:20px;margin-top:18px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:10px;border-bottom:1px solid #294158;text-align:right;vertical-align:top}th{color:#c8a96b;background:#0B1F33}.muted{color:#b7c4ce}.status{padding:4px 8px;border:1px solid #526577}.approved{border-color:#7fb58a}.rejected{border-color:#c77b7b}.pending{border-color:#c8a96b}</style></head><body><div class="wrap"><header class="top"><div><b>SI — SECURITY INSTRUCTOR</b><div class="muted">Article Moderation / مراجعة المقالات</div></div><div><a class="btn alt" href="admin.html">Back to Admin / العودة للإدارة</a> <a class="btn alt" href="index.html">Back to Website / العودة للموقع</a></div></header><div class="panel"><div><select id="filter"><option value="">All / الكل</option><option value="pending">Pending / قيد المراجعة</option><option value="approved">Approved / معتمد</option><option value="rejected">Rejected / مرفوض</option></select><button class="btn alt" id="refresh">Refresh / تحديث</button></div><div class="table"><table><thead><tr><th>المقال</th><th>الكاتب</th><th>التصنيف</th><th>الحالة</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script>const API='https://security-instructor.onrender.com',K='securityInstructorAdminToken',esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));async function load(){const r=await fetch(API+'/api/admin/articles?status='+encodeURIComponent(document.getElementById('filter').value),{headers:{Authorization:'Bearer '+(localStorage.getItem(K)||'')}}),d=await r.json();if(!r.ok){document.getElementById('rows').innerHTML='<tr><td colspan="6">'+esc(d.message||'Admin login required')+'</td></tr>';return}window.rows=d;document.getElementById('rows').innerHTML=d.length?d.map(x=>`<tr><td><b>${esc(x.titleAr)}</b><br><span class="muted">${esc(x.titleEn)}</span></td><td>${esc(x.authorName)}<br><span class="muted">${esc(x.authorTitle)}</span></td><td>${esc(x.category)}</td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span>${x.rejectionReason?'<div class="muted">'+esc(x.rejectionReason)+'</div>':''}</td><td>${new Date(x.createdAt).toLocaleString()}</td><td><button class="btn alt" onclick="preview('${x.id}')">Preview</button> ${x.status!=='approved'?'<button class="btn" onclick="review(\''+x.id+'\',\'approved\')">Approve</button>':''} ${x.status!=='rejected'?'<button class="btn alt" onclick="reject(\''+x.id+'\')">Reject</button>':''}</td></tr>`).join(''):'<tr><td colspan="6">No articles</td></tr>'}async function review(id,status,reason=''){const r=await fetch(API+'/api/admin/articles/'+encodeURIComponent(id)+'/review',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(localStorage.getItem(K)||'')},body:JSON.stringify({status,rejectionReason:reason})}),d=await r.json();if(!r.ok)alert(d.message||'Unable to update');load()}function reject(id){const reason=prompt('سبب الرفض / Rejection reason:','');if(reason!==null)review(id,'rejected',reason)}function preview(id){const x=window.rows.find(a=>a.id===id);if(!x)return;const w=window.open('','_blank');w.document.write('<html dir="rtl"><body style="font-family:Arial;max-width:900px;margin:40px;line-height:1.9"><img src="'+esc(x.authorImage||'Abdallah_Abdelaziz_Portrait.jpg')+'" style="width:110px;height:110px;object-fit:cover;border-radius:50%"><h1>'+esc(x.titleAr)+'</h1><h2>'+esc(x.titleEn)+'</h2><p><b>'+esc(x.authorName)+'</b> — '+esc(x.authorTitle)+'</p><hr><h3>العربية</h3><p>'+esc(x.contentAr).replace(/\r?\n/g,'<br><br>')+'</p><hr><h3>English</h3><p>'+esc(x.contentEn).replace(/\r?\n/g,'<br><br>')+'</p></body></html>');w.document.close()}document.getElementById('filter').onchange=load;document.getElementById('refresh').onclick=load;load();</script></body></html>
