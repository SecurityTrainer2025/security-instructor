<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article Moderation | SECURITY INSTRUCTOR</title><style>body{margin:0;background:#0B1F33;color:#eef3f7;font-family:Arial;padding:24px}.wrap{max-width:1250px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #294158;padding-bottom:16px}.btn{padding:10px 14px;border:1px solid #c8a96b;background:#c8a96b;color:#101820;font-weight:800;cursor:pointer}.alt{background:transparent;color:#c8a96b}.panel{background:#102A43;border:1px solid #294158;padding:20px;margin-top:18px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:10px;border-bottom:1px solid #294158;text-align:right;vertical-align:top}th{color:#c8a96b;background:#0B1F33}.muted{color:#b7c4ce}.status{padding:4px 8px;border:1px solid #526577}.approved{border-color:#7fb58a}.rejected{border-color:#c77b7b}.pending{border-color:#c8a96b}.modal{position:fixed;inset:0;background:rgba(4,15,25,.82);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-card{width:min(1100px,96vw);max-height:92vh;overflow:auto;background:#102A43;border:1px solid #c8a96b;padding:24px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.modal label{display:block;font-weight:800;margin-bottom:6px}.modal input,.modal textarea,.modal select{width:100%;box-sizing:border-box;background:#0B1F33;color:#fff;border:1px solid #526577;padding:11px}.modal textarea{min-height:180px;line-height:1.8}.modal .wide{grid-column:1/-1}@media(max-width:800px){.modal-grid{grid-template-columns:1fr}.modal .wide{grid-column:auto}}
</style></head><body><div class="wrap"><header class="top"><div><b>SI — SECURITY INSTRUCTOR</b><div class="muted">Article Moderation / مراجعة المقالات</div></div><div><a class="btn alt" href="admin.html">Back to Admin / العودة للإدارة</a> <a class="btn alt" href="index.html">Back to Website / العودة للموقع</a></div></header><div class="panel"><div><select id="filter"><option value="">All / الكل</option><option value="pending">Pending / قيد المراجعة</option><option value="approved">Approved / معتمد</option><option value="rejected">Rejected / مرفوض</option></select><button class="btn alt" id="refresh">Refresh / تحديث</button></div><div class="table"><table><thead><tr><th>المقال</th><th>الكاتب</th><th>التصنيف</th><th>الحالة</th><th>الكلمات</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div id="editModal" class="modal" style="display:none"><div class="modal-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">Edit Article / تعديل المقال</h2><button class="btn alt" id="closeEdit">Close / إغلاق</button></div><form id="editForm"><div class="modal-grid"><label>English Title<input id="eTitleEn" required></label><label>Arabic Title<input id="eTitleAr" required dir="rtl"></label><label>Author<input id="eAuthor" required></label><label>Professional Title<input id="eAuthorTitle"></label><label>Category<input id="eCategory" required></label><label>Source Language<select id="eSource"><option value="en">English</option><option value="ar">العربية</option></select></label><label class="wide">English Summary<textarea id="eExcerptEn"></textarea></label><label class="wide">Arabic Summary<textarea id="eExcerptAr" dir="rtl"></textarea></label><label class="wide">English Article<textarea id="eContentEn"></textarea></label><label class="wide">Arabic Article<textarea id="eContentAr" dir="rtl"></textarea></label></div><div style="margin-top:12px;color:#b7c4ce">Article length: 700–1500 words. / طول المقال: 700–1500 كلمة.</div><div style="margin-top:14px;display:flex;justify-content:flex-end;gap:10px"><button class="btn" type="submit">Save Changes / حفظ التعديلات</button></div><div id="editStatus" class="muted" style="margin-top:10px"></div></form></div></div><script>const API='https://security-instructor.onrender.com',K='securityInstructorAdminToken',esc=s=>String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));let rows=[];let editingId='';const auth=()=>({Authorization:'Bearer '+(localStorage.getItem(K)||'')});async function load(){const r=await fetch(API+'/api/admin/articles?status='+encodeURIComponent(document.getElementById('filter').value),{headers:auth()}),d=await r.json();if(!r.ok){document.getElementById('rows').innerHTML='<tr><td colspan="7">'+esc(d.message||'Admin login required')+'</td></tr>';return}rows=d;document.getElementById('rows').innerHTML=d.length?d.map(x=>`<tr><td><b>${esc(x.titleAr)}</b><br><span class="muted">${esc(x.titleEn)}</span></td><td>${esc(x.authorName)}<br><span class="muted">${esc(x.authorTitle)}</span></td><td>${esc(x.category)}</td><td><span class="status ${esc(x.status)}">${esc(x.status)}</span>${x.rejectionReason?'<div class="muted">'+esc(x.rejectionReason)+'</div>':''}</td><td>${x.wordCountEn}/${x.wordCountAr}</td><td>${new Date(x.createdAt).toLocaleString()}</td><td><button class="btn alt" onclick="editArticle('${x.id}')">Edit / تعديل</button> <button class="btn alt" onclick="preview('${x.id}')">Preview</button> ${x.status!=='approved'?'<button class="btn" onclick="review(\''+x.id+'\',\'approved\')">Approve</button>':''} ${x.status!=='rejected'?'<button class="btn alt" onclick="reject(\''+x.id+'\')">Reject</button>':''}</td></tr>`).join(''):'<tr><td colspan="7">No articles</td></tr>'}async function review(id,status,reason=''){const r=await fetch(API+'/api/admin/articles/'+encodeURIComponent(id)+'/review',{method:'PATCH',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({status,rejectionReason:reason})}),d=await r.json();if(!r.ok)alert(d.message||'Unable to update');load()}function reject(id){const reason=prompt('سبب الرفض / Rejection reason:','');if(reason!==null)review(id,'rejected',reason)}function preview(id){const x=rows.find(a=>a.id===id);if(!x)return;const w=window.open('','_blank');w.document.write('<html dir="rtl"><body style="font-family:Arial;max-width:1100px;margin:40px;line-height:1.9;background:#0B1F33;color:#fff"><img src="'+esc(x.authorImage||'Abdallah_Abdelaziz_Portrait.jpg')+'" style="width:130px;height:165px;object-fit:contain;border:1px solid #c8a96b"><h1>'+esc(x.titleAr)+'</h1><h2>'+esc(x.titleEn)+'</h2><p><b>'+esc(x.authorName)+'</b> — '+esc(x.authorTitle)+'</p><hr><h3>العربية</h3><p>'+esc(x.contentAr).replace(/\r?\n/g,'<br><br>')+'</p><hr><h3>English</h3><p>'+esc(x.contentEn).replace(/\r?\n/g,'<br><br>')+'</p></body></html>');w.document.close()}
function editArticle(id){const x=rows.find(a=>a.id===id);if(!x)return;editingId=id;document.getElementById('eTitleEn').value=x.titleEn;document.getElementById('eTitleAr').value=x.titleAr;document.getElementById('eAuthor').value=x.authorName;document.getElementById('eAuthorTitle').value=x.authorTitle||'';document.getElementById('eCategory').value=x.category;document.getElementById('eSource').value=x.sourceLanguage||'en';document.getElementById('eExcerptEn').value=x.excerptEn;document.getElementById('eExcerptAr').value=x.excerptAr;document.getElementById('eContentEn').value=x.contentEn;document.getElementById('eContentAr').value=x.contentAr;document.getElementById('editStatus').textContent='';document.getElementById('editModal').style.display='flex'}document.getElementById('closeEdit').onclick=()=>document.getElementById('editModal').style.display='none';document.getElementById('editForm').onsubmit=async e=>{e.preventDefault();const b={titleEn:eTitleEn.value,titleAr:eTitleAr.value,authorName:eAuthor.value,authorTitle:eAuthorTitle.value,category:eCategory.value,sourceLanguage:eSource.value,excerptEn:eExcerptEn.value,excerptAr:eExcerptAr.value,contentEn:eContentEn.value,contentAr:eContentAr.value};document.getElementById('editStatus').textContent='Saving… / جارٍ الحفظ…';const r=await fetch(API+'/api/admin/articles/'+encodeURIComponent(editingId),{method:'PATCH',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify(b)}),d=await r.json();if(!r.ok){document.getElementById('editStatus').textContent=d.message||'Unable to save';return}document.getElementById('editStatus').textContent='Saved successfully / تم الحفظ بنجاح';setTimeout(()=>{document.getElementById('editModal').style.display='none';load()},700)};document.getElementById('filter').onchange=load;document.getElementById('refresh').onclick=load;load();</script></body></html>
