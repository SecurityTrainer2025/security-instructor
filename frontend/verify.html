<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Verification | التحقق من الوثيقة | SECURITY INSTRUCTOR</title><style>:root{--n:#0B1F33;--g:#C8A96B;--paper:#FAF8F3;--ok:#166534;--bad:#991B1B}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#071A2D,#102B43);font-family:Arial,Tahoma,sans-serif;color:#fff}.wrap{max-width:820px;margin:40px auto;padding:20px}.card{background:var(--paper);color:#17202A;border:4px solid var(--n);outline:1px solid var(--g);padding:38px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.25)}.brand{color:var(--n);font-weight:900;letter-spacing:.12em;font-size:18px}.ey{color:#8A6C30;font-size:11px;letter-spacing:.18em;font-weight:900;margin-top:25px}.state{margin:25px 0;padding:16px;border:1px solid var(--g);background:#fff;font-size:18px}.valid{color:var(--ok);font-weight:900}.invalid{color:var(--bad);font-weight:900}.revoked{color:#8A3B12;font-weight:900}.course{background:var(--n);color:#fff;border:1px solid var(--g);padding:18px;margin:20px 0;font-size:17px}.ar{direction:rtl;font-family:Tahoma,Arial,sans-serif}.meta{line-height:1.9;color:#5f6b76;font-size:14px}.verified{margin-top:18px;padding:14px;border:1px solid #C8A96B;background:#fff;font-size:12px}.verified strong{color:var(--n)}.back{display:inline-block;margin-top:20px;background:var(--g);color:#101820;text-decoration:none;padding:10px 15px;font-weight:800}</style></head><body><main class="wrap"><section class="card"><div class="brand">SI | SECURITY INSTRUCTOR</div><div class="ey">DOCUMENT VERIFICATION / التحقق من الوثيقة</div><div id="state" class="state">Checking document… / جارٍ التحقق من الوثيقة...</div><div id="content"></div><a class="back" href="index.html">Back to Platform / العودة للمنصة</a></section></main><script>(async function(){const API=(window.APP_CONFIG&&window.APP_CONFIG.API_BASE)||'https://security-instructor.onrender.com';const q=new URLSearchParams(location.search),type=q.get('type')||'certificate',id=q.get('id');const state=document.getElementById('state'),content=document.getElementById('content');try{if(!id)throw new Error('Document ID is required');const endpoint=type==='certificate'?API+'/api/verify/training-certificate?id='+encodeURIComponent(id):API+'/api/verify/document?type=letter&id='+encodeURIComponent(id);const r=await fetch(endpoint,{cache:'no-store'});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw new Error('Verification service returned an invalid response')};if(!r.ok)throw new Error(d.message||'Document not found');if(!d.valid){state.className='state revoked';state.innerHTML='REVOKED DOCUMENT / وثيقة ملغاة';content.innerHTML='<p>This certificate exists in the official record, but its verification status is revoked.</p><p class="ar">هذه الشهادة موجودة في السجل الرسمي، ولكن حالة التحقق منها ملغاة.</p><div class="verified"><strong>Certificate ID:</strong> '+(d.certificateId||'—')+'</div>';return;}state.className='state valid';state.innerHTML='VALID DOCUMENT / وثيقة صالحة';const isLetter=type==='letter',recipient=d.recipientName||d.recipientNameEn||'—',docId=d.documentId||d.certificateId||'—';content.innerHTML='<h2>'+d.documentType+'<br><span class="ar">'+d.documentTypeAr+'</span></h2><div class="meta"><b>Recipient / المستفيد:</b> '+recipient+'<br><b>Document ID / رقم الوثيقة:</b> '+docId+'<br>'+(d.traineeId?'<b>Trainee ID / رقم المتدرب:</b> '+d.traineeId+'<br>':'')+(d.idNumberMasked?'<b>ID Number / رقم الهوية:</b> '+d.idNumberMasked+'<br>':'')+'<b>Issue Date / تاريخ الإصدار:</b> '+new Date(d.issuedAt).toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})+'</div><div class="verified">✓ <strong>Verified against the official SECURITY INSTRUCTOR certificate record.</strong><br><span class="ar">✓ التحقق مرتبط بسجل الشهادة الرسمي في منصة SECURITY INSTRUCTOR.</span></div><div class="course"><b>'+d.courseNameEn+'</b><br><span class="ar">'+d.courseNameAr+'</span></div>'+(isLetter?'<p>Issued in recognition of successful completion of the initial assessment.</p><p class="ar">صدر تقديرًا لاجتياز التقييم المبدئي بنجاح.</p>':'<p>Issued in recognition of successful completion of the training course.</p><p class="ar">صدرت تقديرًا لاجتياز الدورة التدريبية وإتمام متطلباتها.</p>')}catch(e){state.className='state invalid';state.innerHTML='INVALID / غير صالحة';content.innerHTML='<p>'+e.message+'</p>'}})();</script></body></html>
