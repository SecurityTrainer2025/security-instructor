<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Permissions-Policy" content="display-capture=()"><title>Protected Assessment | SECURITY INSTRUCTOR</title><link rel="stylesheet" href="security-visitor.css?v=20260916"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0B1F33;font-family:Arial,Tahoma,sans-serif}.assessment-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0B1F33}.gateway-bar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(11,31,51,.94);border:1px solid #c8a96b;color:#fff;padding:7px 12px;font-size:11px;letter-spacing:.04em;border-radius:4px;pointer-events:none}.gateway-bar b{color:#c8a96b}.gateway-status{position:fixed;right:12px;bottom:12px;z-index:20;background:rgba(11,31,51,.9);border:1px solid #c8a96b;color:#cbd5df;padding:7px 10px;font-size:10px;border-radius:4px}.si-cert{z-index:2147483647}</style></head><body><div class="gateway-bar"><b>SI</b> • Protected Assessment / التقييم المحمي</div><iframe id="assessmentFrame" class="assessment-frame" title="Initial Course Assessment / التقييم المبدئي"></iframe><div id="gatewayStatus" class="gateway-status">Protected / محمي</div><script src="security-visitor.js?v=20260916"></script><script>(function(){if(window.SIVisitorSecurity)window.SIVisitorSecurity.protect({allowFrameFocus:true});const qs=new URLSearchParams(location.search);const course=qs.get('course')||'traffic-management-vehicle-control';const frame=document.getElementById('assessmentFrame');const status=document.getElementById('gatewayStatus');let attempt=null,processed=false,loading=false;async function start(){if(loading)return;loading=true;processed=false;const r=await window.SIVisitorSecurity.startAttempt('assessment',course);loading=false;if(r.error){status.textContent=r.error+' / تعذر بدء المحاولة';return}attempt=r;status.textContent='Attempt '+r.attemptNumber+' of 2 / المحاولة '+r.attemptNumber+' من 2'}function finish(score){if(processed||!attempt)return;processed=true;window.SIVisitorSecurity.completeAttempt(attempt.attemptId,score).then(result=>{const pass=score>=7;status.textContent=pass?'Passed 7/10+ / اجتياز':'Below 7/10 / أقل من 7 من 10';const root=frame.contentDocument;const resultBox=root&&root.getElementById('result');if(resultBox){const p=root.createElement('div');p.style.cssText='background:#0B1F33;color:#fff;border:1px solid #c8a96b;padding:18px;margin:20px;text-align:center;font-family:Arial';p.innerHTML=pass?'<b style="color:#c8a96b">Certificate eligible / مؤهل للشهادة</b><br><button id="siGatewayCert" style="margin-top:12px;padding:10px 14px;background:#c8a96b;border:1px solid #c8a96b;font-weight:800">Issue Certificate / إصدار الشهادة</button>':'<span>First attempt did not reach 7/10. You may use one more attempt. / المحاولة الأولى لم تصل إلى 7 من 10، ويمكنك استخدام محاولة أخرى.';resultBox.appendChild(p);if(pass)root.getElementById('siGatewayCert').onclick=()=>window.SIVisitorSecurity.certPrompt({attemptId:attempt.attemptId})}})});}
frame.addEventListener('load',async()=>{await start();let tries=0;const timer=setInterval(()=>{tries++;try{const doc=frame.contentDocument;if(!doc)return;const result=doc.getElementById('result');const scoreEl=doc.getElementById('score');if(result&&scoreEl&&getComputedStyle(result).display!=='none'){const m=String(scoreEl.textContent||'').match(/(\d+)\s*\/\s*10/);if(m)finish(Number(m[1]));}if(tries>900)clearInterval(timer)}catch{}},500)});frame.src='course-assessment-v2.html?course='+encodeURIComponent(course);})();</script></body></html>
